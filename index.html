/* Ajustes solicitados: atalhos de multas, cores de pontos e pastas mensais */
.sidebar-back{border:1px solid var(--line)!important;background:#f8fafc!important;color:var(--text)!important;margin-bottom:8px}
.sidebar-back .arrow{font-size:16px;font-weight:900}.shortcut-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;margin:14px 10px 8px}.nav button.shortcut-active{background:#eaf2ff;color:#1d4ed8}.priority-card{border:1px solid var(--line);background:#f8fafc;border-radius:14px;padding:10px 10px;margin:8px 0;display:block;text-align:left;color:var(--text)}.priority-card:hover{border-color:#93c5fd;background:#f8fbff}.priority-card b{font-size:12px}.priority-card small{display:block;color:var(--muted);margin-top:4px;font-size:11px;line-height:1.25}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);margin-right:6px}.collapse-hint{font-size:11px;color:var(--muted);font-weight:700;margin:8px 10px 0;line-height:1.35}.tag.risk-low{background:#ecfdf5;color:#047857}.tag.risk-mid{background:#fffbeb;color:#92400e}.tag.risk-high{background:#fef2f2;color:#991b1b}.tag.risk-critical{background:#7f1d1d;color:#fff}.tag.sev-leve{background:#ecfdf5;color:#047857}.tag.sev-media{background:#fffbeb;color:#92400e}.tag.sev-grave{background:#fff1f2;color:#be123c}.tag.sev-gravissima{background:#7f1d1d;color:#fff}.folder-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.folder-actions .btn{box-shadow:none}.folder strong .folder-count{float:right;color:var(--muted);font-size:12px;font-weight:800}.folder small.warn{color:#92400e;font-weight:800}

function addedKeyMulta(r){
  const n=Number(r?.id);
  if(Number.isFinite(n)) return n;
  const raw=String(r?.created_at||r?.createdAt||r?.inserted_at||r?.updated_at||'');
  const t=Date.parse(raw);
  return Number.isFinite(t)?t:0;
}
function priorityClassMulta(r){
  const d=daysUntil(r?.prazo);
  if(typeof d==='number' && d<=7) return 'priority-urgent';
  if(typeof d==='number' && d<=30) return 'priority-warn';
  return 'priority-ok';
}
function priorityStatusLabel(r){
  const st=statusMulta(r?.status);
  if(st==='aguardando_assinatura') return 'Assinatura';
  if(st==='aguardando_aceite') return 'Aceite';
  return statusNice(st);
}
function priorityPrazoLabel(r){
  const d=daysUntil(r?.prazo);
  if(typeof d==='number') return d<0 ? `Vencido ${Math.abs(d)}d` : `${d}d`;
  return 'Sem prazo';
}
function renderNav(){
  const nav=document.getElementById('nav');
  if(currentPage==='multas' && multasSidebarCollapsed){
    const shortcuts=[
      ['', 'Todos'],['aguardando_aceite','Aguardando aceite'],['aguardando_assinatura','Aguardando assinatura'],['pago','Pagas'],['aceito','Aceitas CDT/SNT'],['recorrida','Recorridas'],['sem_necessidade','Sem necessidade'],['demitido','Demitido']
    ];
    const countStatus=st=>st?data.multas.filter(r=>statusMulta(r.status)===st).length:data.multas.length;
    const priority=data.multas.filter(r=>['aguardando_aceite','aguardando_assinatura'].includes(statusMulta(r.status))).sort((a,b)=>{
      const da=daysUntil(a.prazo), db=daysUntil(b.prazo);
      const va=typeof da==='number'?da:999999, vb=typeof db==='number'?db:999999;
      return va-vb || addedKeyMulta(b)-addedKeyMulta(a);
    }).slice(0,5);
    nav.innerHTML=`<button class="sidebar-back" onclick="toggleMultasSidebar(false)"><span>← Outros módulos</span></button><div class="shortcut-title">Atalhos</div>`+
      shortcuts.map(([st,label])=>`<button class="shortcut-btn ${selectedMultaStatus===st?'shortcut-active':''}" onclick="selectMultaStatus('${st}')"><span class="nav-label">${label}</span><span class="pill shortcut-pill">${countStatus(st)}</span></button>`).join('')+
      `<div class="shortcut-title">Prioridade</div>`+
      (priority.length?priority.map(r=>`<button class="priority-card ${priorityClassMulta(r)}" onclick="openForm('multas',${r.id})"><span class="priority-plate">${esc(r.placa||'-')}</span><span class="priority-status tag amber">${esc(priorityStatusLabel(r))}</span><span class="priority-name">${esc(r.motorista||'Sem motorista')}</span><span class="priority-meta"><span>${fmtDate(r.data)} • Auto ${esc(r.auto||'-')}</span><span class="priority-prazo">${priorityPrazoLabel(r)}</span></span></button>`).join(''):'<div class="collapse-hint">Nenhuma multa pendente em prioridade.</div>')+
      `<div class="collapse-hint">Clique em “Outros módulos” para abrir as demais abas. Ao clicar em Multas novamente, os atalhos voltam.</div>`;
    return;
  }
  nav.innerHTML=pages.map(([key,title])=>`<button data-page="${key}" class="${key===currentPage?'active':''}">${title}<span class="pill">${countFor(key)}</span></button>`).join('');
  document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
}

function daysUntil(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return 'sem prazo';const today=new Date();today.setHours(0,0,0,0);return Math.ceil((new Date(d+'T00:00:00')-today)/86400000)}
function countFor(k){return k==='dashboard'?'':k==='pontos'?Object.keys(pointSummary()).length:k==='oleo'?data.oleo.length:k==='producao'?data.producaoMeses.length:(data[k]||[]).length}

function stats(items){return `<div class="stats">${items.map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong><em>${x[2]||''}</em></div>`).join('')}</div>`}
function statusTag(v){let vv=String(v||'').toLowerCase();let c=vv==='pago'||vv==='ativo'||vv==='concluido'||vv==='ok'||vv==='baixo'?'green':vv==='pendente'||vv==='atenção'||vv==='aguardando_aceite'||vv==='aguardando_assinatura'||vv==='medio'||vv==='médio'?'amber':vv==='vencido'||vv==='inativo'||vv==='alto'?'red':vv==='critico'||vv==='crítico'?'risk-critical':vv==='aceito'?'blue':vv==='recorrida'?'violet':'gray';return `<span class="tag ${c}">${esc(statusNice(v))}</span>`}
function gravidadeTag(v){const c=clean(v);let cls=c.includes('gravissima')?'sev-gravissima':c.includes('grave')?'sev-grave':c.includes('media')?'sev-media':'sev-leve';return `<span class="tag ${cls}">${esc(v||'-')}</span>`}
function riscoPontosTag(p){p=Number(p||0);return p>=20?'<span class="tag risk-critical">crítico</span>':p>=15?'<span class="tag risk-high">alto</span>':p>=8?'<span class="tag risk-mid">atenção</span>':'<span class="tag risk-low">baixo</span>'}
function statusNice(v){const map={aguardando_aceite:'Aguardando aceite',aguardando_assinatura:'Aguardando assinatura',pago:'Paga',aceito:'Aceita no CDT/SNT',recorrida:'Recorrida / em análise',sem_necessidade:'Sem necessidade',demitido:'Motorista demitido',ativo:'Ativo',ferias:'Férias',afastado:'Afastado',inativo:'Inativo',concluido:'Concluído',pendente:'Pendente',manutencao:'Manutenção'};return map[String(v||'').toLowerCase()]||String(v||'-').replaceAll('_',' ')}
function optionLabel(prop,o){if(prop==='status')return statusNice(o);if(prop==='pago'&&o==='OK')return 'Pago';return o||'Pendente'}
function render_dashboard(){setActions('<button class="btn" onclick="exportCSV(\'multas\')">Exportar multas CSV</button>');const totalMan=data.manutencoes.reduce((s,r)=>s+(+r.valor||0),0);document.getElementById('dashboard').innerHTML=stats([['Veículos',data.veiculos.length,'veículos cadastrados'],['Motoristas',data.motoristas.length,'cadastros'],['Multas',data.multas.length,'registros'],['Manutenção',BRL(totalMan),'valor total']])+`<div class="table-card"><div class="table-head"><h3>Visão geral</h3><small>Dados carregados no arquivo</small></div><div class="table-scroll"><table><thead><tr><th>Módulo</th><th>Descrição</th><th>Status</th></tr></thead><tbody>${pages.filter(p=>p[0]!=='dashboard').map(p=>`<tr><td><b>${p[1]}</b></td><td>${p[2]}</td><td>${statusTag('ativo')}</td></tr>`).join('')}</tbody></table></div></div>`}

function oilStatus(r){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.data||'')) return {diff:null,tag:'gray',text:'Data não informada'};
  const base=new Date(r.data+'T00:00:00'), today=new Date();
  today.setHours(0,0,0,0);
  const expire=new Date(base);
  expire.setMonth(expire.getMonth()+3);
  const diff=Math.ceil((expire-today)/86400000);
  let tag=diff<=30?'red':diff<=60?'amber':'green';
  return {diff,tag,text:diff<0?`Vencido há ${Math.abs(diff)} dias`:diff===0?'Vence hoje':`Faltam ${diff} dias`}
}

async function saveModal(){
  const {key,itemId}=modalCtx;
  const obj=itemId?data[key].find(x=>x.id===itemId):{id:id()};
  schemas[key].forEach(([prop,,type])=>{
    let v=document.getElementById('f_'+prop).value;
    if(type==='number')v=Number(v||0);
    if(prop==='placa')v=v.toUpperCase();
    obj[prop]=v;
  });
  try{
    if(key==='multas') await salvarMultaSupabase(obj);
    if(!itemId)data[key].push(obj);
    if(key==='producao'&&!data.producaoMeses.some(x=>x.mes===obj.mes))data.producaoMeses.push({mes:obj.mes});
    closeModal();
    toast(key==='multas'?'Multa salva no Supabase.':'Alteração salva nesta sessão.');
    showPage(currentPage);
  }catch(e){
    console.error(e);

  }

async function removeItem(key,itemId){
  if(!confirm('Excluir este registro?'))return;

    console.error(e);
    alert('Erro ao excluir: '+(e.message||e));
  }
}

function monthsBy(arr, prop){return [...new Set((arr||[]).map(r=>ym(r[prop]||r.data||'')).filter(Boolean))].sort();}
function folderCountEmpresa(key,m){
  const arr = key==='tacografos'?data.tacografos:key==='oleo'?data.oleo:key==='manutencoes'?data.manutencoes:data.producao;
  const prop = key==='tacografos'?'validade':key==='oleo'?'data':'data';
  const rows = arr.filter(r=>!m || ym(r[prop]||r.data)===m);
  const unique = new Set(rows.map(r=>String(r.placa||'').replace(/\s+/g,'').toUpperCase())).size;
  if(key==='manutencoes'){
    const total = rows.reduce((s,r)=>s+(Number(r.valor)||0),0);
    const ticket = rows.length ? total/rows.length : 0;
    return `${rows.length} registros • ${unique} veículos • ${BRL(total)} • média ${BRL(ticket)}`;
  }
  return `${rows.length} registros • ${unique} veículos`;
}

function pointSummary(){
  const map={};
  (data.pontos||[]).forEach(p=>{
    const k=clean(p.motorista||'');
    if(!map[k]) map[k]={motorista:p.motorista,pontos:0,qtd:0,pontos45:0,qtd45:0};
    map[k].pontos += Number(p.pontos||0);
    map[k].qtd += 1;
    if(Number(p.flag_45d||0)){ map[k].pontos45 += Number(p.pontos||0); map[k].qtd45 += 1; }
  });
  return map;
}

/* Ajuste RCA: nova seção/status em Multas */
function statusMulta(v){
  v=String(v||'').toLowerCase().trim();
  if(['pago','pagas'].includes(v)) return 'pago';
  if(['aceito','aceita','aceito_cdt','aceita_cdt','aceito_snt','aceita_snt'].includes(v)) return 'aceito';
  if(['enviado_rca','enviado_para_rca','enviado para rca','rca','enviado'].includes(v)) return 'enviado_rca';
  if(['aguardando_assinatura','aguardando assinatura','assinatura','aguardando_assinar'].includes(v)) return 'aguardando_assinatura';
  if(['aguardando_aceite','aguardando_motorista','pendente','vencido'].includes(v)) return 'aguardando_aceite';
  if(['recorrida','em_analise','em análise','analise'].includes(v)) return 'recorrida';
  if(['sem_necessidade','sem necessidade','s/ necessidade','s/ nessecidade'].includes(v)) return 'sem_necessidade';
  if(['demitido','motorista_demitido'].includes(v)) return 'demitido';
  return v || 'aguardando_aceite';
}
function inferStatusMulta(r){
  const ass=String(r.assinado||'').toUpperCase().trim();
  const pg=String(r.pago||'').toUpperCase().trim();
  const obs=String(r.obs||'').toUpperCase();
  const t=[r.assinado,r.obs,r.pago,r.envioRCA,r.envio_rca,r.dp,r.status].join(' ').toUpperCase();
  if(t.includes('RCA')) return 'enviado_rca';
  if(t.includes('RECORR')) return 'recorrida';
  if(t.includes('AGUARDANDO ASSINATURA') || t.includes('ASSINATURA PENDENTE')) return 'aguardando_assinatura';
  if(t.includes('DEMIT')) return 'demitido';
  if(pg==='OK') return 'pago';
  if(obs.includes('AGUARD') && obs.includes('ACEITE')) return 'aguardando_aceite';
  if(ass==='OK') return 'aceito';
  if(t.includes('S/') || t.includes('SEM COBRAN') || t.includes('S/N')) return 'sem_necessidade';
  return 'aguardando_aceite';
}
function statusNice(v){
  const map={aguardando_aceite:'Aguardando aceite',aguardando_assinatura:'Aguardando assinatura',enviado_rca:'Enviado para RCA',enviado_para_rca:'Enviado para RCA',pago:'Paga',aceito:'Aceita no CDT/SNT',recorrida:'Recorrida / em análise',sem_necessidade:'Sem necessidade',demitido:'Motorista demitido',ativo:'Ativo',ferias:'Férias',afastado:'Afastado',inativo:'Inativo',concluido:'Concluído',pendente:'Pendente',manutencao:'Manutenção'};
  return map[String(v||'').toLowerCase()]||String(v||'-').replaceAll('_',' ');
}
function statusTag(v){
  let vv=statusMulta(v);
  let c=vv==='pago'||vv==='ativo'||vv==='concluido'||vv==='ok'||vv==='baixo'?'green':vv==='enviado_rca'?'rca':vv==='pendente'||vv==='atenção'||vv==='aguardando_aceite'||vv==='aguardando_assinatura'||vv==='medio'||vv==='médio'?'amber':vv==='vencido'||vv==='inativo'||vv==='alto'?'red':vv==='critico'||vv==='crítico'?'risk-critical':vv==='aceito'?'blue':vv==='recorrida'?'violet':'gray';
  return `<span class="tag ${c}">${esc(statusNice(vv))}</span>`;
}

  const map={aguardando_aceite:'Aguardando aceite',aguardando_assinatura:'Aguardando assinatura',pago:'Paga',aceito:'Aceita no CDT/SNT',recorrida:'Recorrida / em análise',sem_necessidade:'Sem necessidade',demitido:'Motorista demitido',ativo:'Ativo',ferias:'Férias',afastado:'Afastado',inativo:'Inativo',concluido:'Concluído',pendente:'Pendente',manutencao:'Manutenção',ok:'OK'};
  return map[k]||String(v||'-').replaceAll('_',' ');
};
window.statusTag=function(v){
  let vv=statusMulta(v);
  let c=vv==='pago'||vv==='ativo'||vv==='concluido'||vv==='ok'||vv==='baixo'?'green':vv==='pendente'||vv==='atenção'||vv==='aguardando_aceite'||vv==='aguardando_assinatura'||vv==='medio'||vv==='médio'?'amber':vv==='vencido'||vv==='inativo'||vv==='alto'||vv==='demitido'?'red':vv==='critico'||vv==='crítico'?'risk-critical':vv==='aceito'?'blue':vv==='recorrida'?'violet':'gray';
  return `<span class="tag ${c}">${esc(statusNice(vv))}</span>`;
};

 (data.motoristas||[]).forEach(r=>{if(r.validade){const d=daysUntil(r.validade); if(Number.isFinite(d)&&d<=60) alerts.push({c:d<=30?'red':'amber',t:`CNH ${r.nome}`,d:d<0?`Vencida há ${Math.abs(d)} dias`:`Vence em ${d} dias`});}});

<script id="auto-pontos-multas-script">
/* Luiz: ao salvar uma multa, cadastrar/atualizar automaticamente os pontos do motorista. */
(function(){
  const MAPA_PONTOS_MULTA = {
    'leve': 3,
    'media': 4,
    'média': 4,
    'grave': 5,
    'gravissima': 7,
    'gravíssima': 7
  };

  function normTxt(v){
    return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  }

  function gravidadeNice(v){
    const n=normTxt(v);
    if(n==='leve') return 'Leve';
    if(n==='media') return 'Média';
    if(n==='grave') return 'Grave';
    if(n==='gravissima') return 'Gravíssima';
    return '';
  }

  function inferirGravidadeDaMulta(multa){
    const manual=gravidadeNice(multa?.gravidade);
    if(manual) return manual;
    const texto=normTxt([multa?.infracao,multa?.descricao,multa?.obs].join(' '));
    if(texto.includes('gravissima')) return 'Gravíssima';
    if(texto.includes('grave')) return 'Grave';
    if(texto.includes('media')) return 'Média';
    if(texto.includes('leve')) return 'Leve';
    return 'Média';
  }

  function pontosDaGravidade(gravidade){
    const n=normTxt(gravidade);
    return MAPA_PONTOS_MULTA[n] || 4;
  }

  function pontoChave(multa){
    const auto=normTxt(multa?.auto);
    if(auto) return 'auto:'+auto;
    return 'multa:'+String(multa?.id||'');
  }

  function procurarPontoDaMulta(multa){
    const chave=pontoChave(multa);
    const auto=normTxt(multa?.auto);
    return (data.pontos||[]).find(p=>{
      if(p.origem_multa_id && String(p.origem_multa_id)===String(multa?.id)) return true;
      if(p.multaId && String(p.multaId)===String(multa?.id)) return true;
      if(auto && normTxt(p.auto)===auto) return true;
      return p.autoPontoKey===chave;
    });
  }

  async function salvarPontoSupabaseSeguro(ponto){
    try{
      const db = typeof connectSupabase==='function' ? connectSupabase() : null;
      if(!db) return false;
      const payload={
        id:Number(ponto.id),
        motorista:ponto.motorista||'',
        data:ponto.data||'',
        placa:ponto.placa||'',
        auto:ponto.auto||'',
        gravidade:ponto.gravidade||'',
        pontos:Number(ponto.pontos||0),
        aceitou:ponto.aceitou||'Pendente'
      };
      const {error}=await db.from('pontos').upsert(payload,{onConflict:'id'});
      if(error) throw error;
      return true;
    }catch(e){
      console.warn('Ponto automático criado localmente, mas não foi salvo no Supabase:', e);
      return false;
    }
  }

  async function sincronizarPontoDaMulta(multa){
    if(!multa || !multa.motorista || normTxt(multa.motorista)==='s/n') return null;
    if(!data.pontos) data.pontos=[];

    const gravidade=inferirGravidadeDaMulta(multa);
    const pontos=pontosDaGravidade(gravidade);
    let ponto=procurarPontoDaMulta(multa);
    const novo=!ponto;

    if(!ponto){
      ponto={id: (typeof id==='function'?id():Date.now())};
      data.pontos.push(ponto);
    }

    Object.assign(ponto,{
      motorista:multa.motorista||'',
      data:multa.data||'',
      placa:multa.placa||'',
      auto:multa.auto||'',
      gravidade,
      pontos,
      aceitou:ponto.aceitou||'Pendente',
      multaId:multa.id,
      origem_multa_id:multa.id,
      autoPontoKey:pontoChave(multa),
      origem:'multa automática'
    });

    await salvarPontoSupabaseSeguro(ponto);
    return {ponto,novo};
  }

  async function carregarPontosSupabaseSeguro(){
    try{
      const db = typeof connectSupabase==='function' ? connectSupabase() : null;
      if(!db) return;
      const {data:rows,error}=await db.from('pontos').select('*').order('data',{ascending:false});
      if(error) throw error;
      if(Array.isArray(rows)){
        data.pontos=rows.map(r=>({
          id:Number(r.id),
          motorista:r.motorista||'',
          data:r.data||'',
          placa:r.placa||'',
          auto:r.auto||'',
          gravidade:r.gravidade||'',
          pontos:Number(r.pontos||0),
          aceitou:r.aceitou||'Pendente'
        }));
        if(['pontos','motoristas','dashboard'].includes(currentPage)) showPage(currentPage);
      }
    }catch(e){
      console.warn('Não foi possível carregar pontos do Supabase. Usando dados locais.', e);
    }
  }

  window.sincronizarPontoDaMulta = sincronizarPontoDaMulta;
  window.carregarPontosSupabaseSeguro = carregarPontosSupabaseSeguro;

  if(window.schemas && Array.isArray(window.schemas?.multas)){
    const temGravidade = schemas.multas.some(c=>c[0]==='gravidade');
    if(!temGravidade){
      const idx = schemas.multas.findIndex(c=>c[0]==='infracao');
      schemas.multas.splice(idx>=0?idx+1:schemas.multas.length,0,['gravidade','Gravidade da infração','select:Automático,Leve,Média,Grave,Gravíssima']);
    }
  }

  const saveModalOriginal = window.saveModal;
  window.saveModal = async function(){
    const ctx = window.modalCtx ? {...window.modalCtx} : (typeof modalCtx!=='undefined' && modalCtx ? {...modalCtx} : null);
    const idsAntes = new Set((data?.multas||[]).map(x=>String(x.id)));
    await saveModalOriginal.apply(this, arguments);

    if(!ctx || ctx.key!=='multas') return;
    const multa = ctx.itemId
      ? (data.multas||[]).find(x=>String(x.id)===String(ctx.itemId))
      : ((data.multas||[]).find(x=>!idsAntes.has(String(x.id))) || (data.multas||[]).slice().sort((a,b)=>Number(b.id||0)-Number(a.id||0))[0]);

    const res = await sincronizarPontoDaMulta(multa);
    if(res){
      if(typeof toast==='function') toast(res.novo?'Multa salva e pontos cadastrados automaticamente.':'Multa salva e pontos atualizados automaticamente.');
      if(['multas','pontos','motoristas','dashboard'].includes(currentPage)) showPage(currentPage);
    }
  };

  // Carrega a tabela pontos, se existir no Supabase. Se não existir, o sistema continua usando os dados locais.
  setTimeout(carregarPontosSupabaseSeguro, 700);
})();
</script>

<script id="ajustes-finais-vibrante-tema-pesquisas-alertas">
(function(){
  const MIN_OIL_EXPIRY = '2026-03-01';
  function parseDateSafe(d){return /^\d{4}-\d{2}-\d{2}$/.test(String(d||''))?new Date(d+'T00:00:00'):null;}
  function expiryOilDate(r){const base=parseDateSafe(r?.data); if(!base) return null; const exp=new Date(base); exp.setMonth(exp.getMonth()+3); return exp;}
  function ymd(dt){return dt ? dt.toISOString().slice(0,10) : '';}
  function isOilExpiryConsidered(r){const exp=expiryOilDate(r); return !!exp && ymd(exp) >= MIN_OIL_EXPIRY;}
  window.aplicarTemaFrota=function(theme){document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('gf_theme',theme);const b=document.getElementById('themeToggleBtn');if(b)b.textContent=theme==='dark'?'☀️ Modo claro':'🌙 Modo escuro';};
  window.toggleTemaFrota=function(){aplicarTemaFrota((document.documentElement.getAttribute('data-theme')||'light')==='dark'?'light':'dark');};
  aplicarTemaFrota(localStorage.getItem('gf_theme')||'light');
  function installThemeButton(){const side=document.querySelector('.sidebar'); if(!side || document.getElementById('themeToggleBtn')) return; const btn=document.createElement('button');btn.id='themeToggleBtn';btn.className='theme-toggle';btn.onclick=toggleTemaFrota;btn.textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'☀️ Modo claro':'🌙 Modo escuro'; side.appendChild(btn);} 
  const oldRenderNav=window.renderNav||renderNav; window.renderNav=renderNav=function(){oldRenderNav.apply(this,arguments);setTimeout(installThemeButton,0);}; setTimeout(installThemeButton,300);

  const oldOilStatus = window.oilStatusEmpresa || window.oilStatus;
  window.oilStatusEmpresa=function(r){
    const st=oldOilStatus?oldOilStatus(r):{tag:'gray',text:'sem data'};
    return st;
  };

  window.render_tacografos=function(){
    setActions('<button class="btn primary" onclick="openForm(\'tacografos\')">+ Novo tacógrafo</button>');
    const months=monthsBy(data.tacografos,'validade');
    const rows=data.tacografos.filter(r=>!folderSel.tacografos||ym(r.validade)===folderSel.tacografos);
    document.getElementById('tacografos').innerHTML=stats([['Registros',data.tacografos.length,'tacógrafos'],['Ativos',data.tacografos.filter(x=>clean(x.status).includes('ativo')||clean(x.status).includes('ok')).length,'válidos'],['Pastas',months.length,'por validade'],['Selecionado',folderSel.tacografos?monthName(folderSel.tacografos):'Todos','pasta atual']])+folderHtmlEmpresa('tacografos',months)+filterHtml('tacSearch','Buscar placa, emissão, validade, situação ou observação...')+`<div id="tacInfo"></div>`;
    document.getElementById('tacSearch').oninput=renderTacListEmpresa; renderTacListEmpresa();
  };
  window.renderTacListEmpresa=function(){
    const q=clean(document.getElementById('tacSearch')?.value||'');
    const rows=data.tacografos.filter(r=>(!folderSel.tacografos||ym(r.validade)===folderSel.tacografos)&&(!q||clean(Object.values(r).join(' ')).includes(q)));
    document.getElementById('tacInfo').innerHTML=table(folderSel.tacografos?`Tacógrafos — ${monthName(folderSel.tacografos)}`:'Tacógrafos — Todos os meses',['Placa','Emissão','Validade','Situação','Obs','Ações'],rows.map(r=>`<tr><td><span class="plate">${esc(r.placa)}</span></td><td>${fmtDate(r.data)}</td><td>${fmtDate(r.validade)}</td><td>${statusTag(r.status)}</td><td>${esc(r.obs||'-')}</td><td class="row-actions"><button class="icon-btn" onclick="openForm('tacografos',${r.id})">✎</button><button class="icon-btn" onclick="removeItem('tacografos',${r.id})">×</button></td></tr>`).join(''));
  };

  window.render_oleo=function(){
    setActions('<button class="btn primary" onclick="openForm(\'oleo\')">+ Nova troca</button>');
    const months=monthsBy(data.oleo,'data');
    const all=data.oleo.map(r=>({...r,st:oilStatusEmpresa(r)}));
    document.getElementById('oleo').innerHTML=stats([['Registros',data.oleo.length,'trocas'],['Verde',all.filter(x=>x.st.tag==='green').length,'em dia'],['Amarelo',all.filter(x=>x.st.tag==='amber').length,'atenção'],['Vermelho',all.filter(x=>x.st.tag==='red').length,'urgente/vencido']])+folderHtmlEmpresa('oleo',months)+filterHtml('oleoSearch','Buscar placa, modelo, KM ou observação...')+`<div id="oleoInfo"></div>`;
    document.getElementById('oleoSearch').oninput=renderOleoListEmpresa; renderOleoListEmpresa();
  };
  window.renderOleoListEmpresa=function(){
    const q=clean(document.getElementById('oleoSearch')?.value||'');
    const rows=data.oleo.filter(r=>(!folderSel.oleo||ym(r.data)===folderSel.oleo)&&(!q||clean(Object.values(r).join(' ')).includes(q))).map(r=>({...r,st:oilStatusEmpresa(r)}));
    document.getElementById('oleoInfo').innerHTML=table(folderSel.oleo?`Troca de óleo — ${monthName(folderSel.oleo)}`:'Troca de óleo — Todos os meses',['Placa','Modelo','Última troca','KM atual','Próxima KM','Faltando','Ações'],rows.map(r=>`<tr><td><span class="plate">${esc(r.placa)}</span></td><td>${esc(r.modelo||r.obs||'-')}</td><td>${fmtDate(r.data)}</td><td>${r.km||'-'}</td><td>${r.proxKm||'-'}</td><td><span class="tag ${r.st.tag}">${esc(r.st.text)}</span></td><td class="row-actions"><button class="icon-btn" onclick="openForm('oleo',${r.id})">✎</button><button class="icon-btn" onclick="removeItem('oleo',${r.id})">×</button></td></tr>`).join(''));
  };

  function alertaMultas(){return (data.multas||[]).filter(r=>['aguardando_aceite','aguardando_assinatura'].includes(statusMulta(r.status))).map(r=>{const d=daysUntil(r.prazo);return {grupo:'Multas',c:Number.isFinite(d)&&d<=5?'red':'amber',t:`Multa ${r.placa||'-'}`,d:`${r.motorista||'Sem motorista'} • ${r.prazo?prazoAceiteText(r.prazo):'Sem prazo'}`};}).slice(0,5);}
  function alertaTacografos(){return (data.tacografos||[]).filter(r=>r.validade).map(r=>({r,d:daysUntil(r.validade)})).filter(x=>Number.isFinite(x.d)&&x.d<=60).map(x=>({grupo:'Tacógrafo',c:x.d<=30?'red':'amber',t:`Tacógrafo ${x.r.placa||'-'}`,d:x.d<0?`Vencido há ${Math.abs(x.d)} dias`:`Vence em ${x.d} dias`})).slice(0,5);}
  function alertaOleo(){return (data.oleo||[]).filter(isOilExpiryConsidered).map(r=>({r,st:oilStatusEmpresa(r)})).filter(x=>['red','amber'].includes(x.st.tag)).map(x=>({grupo:'Óleo',c:x.st.tag,t:`Óleo ${x.r.placa||'-'}`,d:x.st.text})).slice(0,5);}
  function alertaCnh(){return (data.motoristas||[]).filter(r=>r.validade).map(r=>({r,d:daysUntil(r.validade)})).filter(x=>Number.isFinite(x.d)&&x.d<=60).map(x=>({grupo:'CNH',c:x.d<=30?'red':'amber',t:`CNH ${x.r.nome||'-'}`,d:x.d<0?`Vencida há ${Math.abs(x.d)} dias`:`Vence em ${x.d} dias`})).slice(0,4);}
  function alertaManut(){return (data.manutencoes||[]).filter(r=>clean(r.status).includes('pendente')).slice(0,4).map(r=>({grupo:'Manutenção',c:'blue',t:`Manutenção ${r.placa||'-'}`,d:`${r.tipo||'Pendente'} • ${fmtDate(r.data)}`}));}
  window.makeAlertsSortido=function(){
    const groups=[alertaMultas(),alertaTacografos(),alertaOleo(),alertaCnh(),alertaManut()];
    const mixed=[]; let i=0; while(mixed.length<16 && groups.some(g=>g.length>i)){for(const g of groups){if(g[i]) mixed.push(g[i]); if(mixed.length>=16) break;} i++;}
    return mixed;
  };
  function alertasHtml(){
    const arr=makeAlertsSortido();
    const content=arr.length?arr.map(a=>`<div class="alert-card ${a.c}"><span class="tag ${a.c==='red'?'red':a.c==='amber'?'amber':a.c==='blue'?'blue':'gray'}">${esc(a.grupo)}</span><b>${esc(a.t)}</b><small>${esc(a.d)}</small></div>`).join(''):'<div class="empty">Nenhum alerta crítico no momento.</div>';
    return `<div class="table-card"><div class="table-head"><h3>Central de alertas</h3><small>Multas, tacógrafos, óleo, CNH e manutenção misturados por prioridade</small></div><div class="alert-mixed-grid">${content}</div></div>`;
  }
  window.render_dashboard=function(){
    setActions('<button class="btn" onclick="exportCSV(\'multas\')">Exportar multas CSV</button>');
    const totalMan=data.manutencoes.reduce((s,r)=>s+(+r.valor||0),0), totalMultas=data.multas.reduce((s,r)=>s+(+r.valor||0),0);
    const alerts=makeAlertsSortido();
    const rankingMotoristas=Object.values((data.multas||[]).reduce((m,r)=>{const k=r.motorista||'Sem motorista';m[k]=m[k]||{nome:k,qtd:0,valor:0};m[k].qtd++;m[k].valor+=(+r.valor||0);return m},{})).sort((a,b)=>b.qtd-a.qtd).slice(0,5);
    const rankingMan=Object.values((data.manutencoes||[]).reduce((m,r)=>{const k=r.placa||'Sem placa';m[k]=m[k]||{placa:k,qtd:0,valor:0};m[k].qtd++;m[k].valor+=(+r.valor||0);return m},{})).sort((a,b)=>b.valor-a.valor).slice(0,5);
    document.getElementById('dashboard').innerHTML=stats([['Veículos',data.veiculos.length,'cadastrados'],['Alertas',alerts.length,'atenção agora'],['Multas',BRL(totalMultas),'valor total'],['Manutenção',BRL(totalMan),'valor total']])+`<div class="global-search-card"><input id="globalSearch" placeholder="Pesquisa global: placa, motorista, CPF, CNH ou auto..."><div class="global-results" id="globalResults"></div></div>`+alertasHtml()+`<div class="dash-grid"><div>${table('Ranking de multas por motorista',['Motorista','Qtd.','Valor'],rankingMotoristas.map(r=>`<tr><td><b>${esc(r.nome)}</b></td><td>${r.qtd}</td><td>${BRL(r.valor)}</td></tr>`).join(''))}</div><div>${table('Veículos com mais custo de manutenção',['Placa','Serviços','Valor'],rankingMan.map(r=>`<tr><td><span class="plate">${esc(r.placa)}</span></td><td>${r.qtd}</td><td>${BRL(r.valor)}</td></tr>`).join(''))}</div></div><div class="table-card"><div class="table-head"><h3>Histórico completo do veículo</h3><small>Digite uma placa na pesquisa global e clique no resultado do veículo</small></div><div id="vehicleHistory" class="vehicle-history"><div class="empty">Nenhum veículo selecionado.</div></div></div>`;
    document.getElementById('globalSearch').oninput=renderGlobalSearch;
  };
  // reforço para edição: as telas já possuem botões; garantimos schema completo
  if(window.schemas){
    if(schemas.manutencoes && !schemas.manutencoes.some(x=>x[0]==='descricao')) schemas.manutencoes.push(['descricao','Descrição','text']);
    if(schemas.producao && !schemas.producao.some(x=>x[0]==='obs')) schemas.producao.push(['obs','Observação','text']);
  }
})();
</script>


<script id="formularios-defeito-module">

  function norm(v){return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
  function ensureDefectSeeds(force=false){
    if(typeof data==='undefined') return;
    if(!Array.isArray(data.formularios_defeito)) data.formularios_defeito=[];
    const hasReal = data.formularios_defeito.some(r=>String(r.defeito||'').trim() && !String(r.obs||'').includes('PDF importado'));
    if(data.formularios_defeito.length && !force) return;
    const ids = new Set(data.formularios_defeito.map(r=>String(r.id)));
    DEFECT_IMPORTED_RECORDS.forEach(r=>{ if(!ids.has(String(r.id))) data.formularios_defeito.push(Object.assign({},r)); });
  }
  window.ensureDefectSeeds = ensureDefectSeeds;

  function defectBadge(v){
    const n=norm(v);
    const cls=n.includes('grave')?'red':n.includes('alta')?'red':n.includes('media')?'amber':n.includes('baixa')?'green':'amber';
    return `<span class="tag ${cls}">${esc(v||'Média')}</span>`;
  }
  function defectStatus(v){
    const n=norm(v);
    const cls=n.includes('resol')||n.includes('concl')?'green':n.includes('andamento')||n.includes('manut')?'amber':'red';
    const txt=v||'Pendente';
    return `<span class="tag ${cls}">${esc(txt)}</span>`;
  }
  function defectCard(r){
    const anexo=r.anexo?`<button class="btn" onclick="window.open('${esc(r.anexo)}','_blank')">Abrir PDF pág. ${esc(r.pagina||'-')}</button>`:'';
    return `<div class="table-card defect-card" style="padding:14px 16px;margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;">
        <div><span class="plate">${esc(r.placa||'SEM PLACA')}</span><h3 style="margin:8px 0 4px;font-size:16px;">${esc(r.motorista||'Motorista não identificado')}</h3><small>${fmtDate(r.data)} • ${monthName(r.mes||ym(r.data))}</small></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">${defectBadge(r.gravidade)} ${defectStatus(r.status)}</div>
      </div>
      <div style="margin-top:12px;line-height:1.45;"><b>Descrição do defeito:</b><br>${esc(r.defeito||'Sem descrição.')}</div>
      <div style="margin-top:8px;color:var(--muted);"><b>Local/componente:</b> ${esc(r.localizacao||'-')} &nbsp; <b>Responsável:</b> ${esc(r.responsavel||'-')}</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">${anexo}<button class="icon-btn" onclick="openForm('formularios_defeito',${Number(r.id)})">✎</button><button class="icon-btn" onclick="removeItem('formularios_defeito',${Number(r.id)})">×</button></div>
      ${r.obs?`<small style="display:block;margin-top:8px;color:var(--muted);">${esc(r.obs)}</small>`:''}
    </div>`;
  }

  window.render_formularios_defeito = function(){
    ensureDefectSeeds();
    setActions(`<button class="btn" onclick="exportCSV('formularios_defeito')">Exportar CSV</button><button class="btn primary" onclick="openForm('formularios_defeito')">+ Novo relatório</button>`);
    const arr=data.formularios_defeito||[];
    const sel=window.selectedDefectMonth||'';
    const meses=[...new Set(arr.map(r=>r.mes||ym(r.data)).filter(Boolean))].sort();
    const folders=`<div class="folder-actions"><button class="btn ${!sel?'primary':''}" onclick="selectDefectMonth('')">Todos</button><small>${meses.length} pastas de formulários</small></div><div class="folders">${meses.map(m=>{const regs=arr.filter(r=>(r.mes||ym(r.data))===m).length;return `<button class="folder ${sel===m?'active':''}" onclick="selectDefectMonth('${m}')"><div class="folder-icon">📋</div><strong>${monthName(m)} <span class="folder-count">${regs}</span></strong><small>${regs} relatórios descritos</small></button>`}).join('')}</div>`;
    document.getElementById('formularios_defeito').innerHTML=stats([
      ['Relatórios',arr.length,'descritos'],
      ['Pendentes',arr.filter(x=>norm(x.status).includes('pend')).length,'em aberto'],
      ['Veículos',new Set(arr.map(x=>x.placa).filter(Boolean)).size,'com registros'],
      ['Meses',meses.length,'pastas']
    ])+folders+filterHtml('defeitoSearch','Buscar placa, motorista, defeito, componente ou status...')+'<div id="defeitosList"></div>';
    document.getElementById('defeitoSearch').oninput=renderDefeitosList;
    renderDefeitosList();
  };
  window.renderDefeitosList=function(){
    ensureDefectSeeds();
    const q=norm(document.getElementById('defeitoSearch')?.value||'');
    const sel=window.selectedDefectMonth||'';
    const rows=(data.formularios_defeito||[]).filter(r=>(!sel||(r.mes||ym(r.data))===sel)&&(!q||norm(Object.values(r).join(' ')).includes(q))).sort((a,b)=>String(b.data||'').localeCompare(String(a.data||''))||Number(b.id||0)-Number(a.id||0));
    const cards=rows.map(defectCard).join('') || '<div class="empty">Nenhum formulário de defeito encontrado.</div>';
    const tabela=table('Resumo dos relatórios de defeito',['Data','Placa','Motorista','Defeito','Gravidade','Status','PDF','Ações'],rows.map(r=>`<tr><td>${fmtDate(r.data)}</td><td><span class="plate">${esc(r.placa||'-')}</span></td><td>${esc(r.motorista||'-')}</td><td>${esc(r.defeito||'-')}</td><td>${defectBadge(r.gravidade)}</td><td>${defectStatus(r.status)}</td><td>${r.anexo?`<button class="btn" onclick="window.open('${esc(r.anexo)}','_blank')">PDF pág. ${esc(r.pagina||'-')}</button>`:'-'}</td><td class="row-actions"><button class="icon-btn" onclick="openForm('formularios_defeito',${Number(r.id)})">✎</button><button class="icon-btn" onclick="removeItem('formularios_defeito',${Number(r.id)})">×</button></td></tr>`).join(''));
    document.getElementById('defeitosList').innerHTML=`<div style="margin-bottom:14px;">${cards}</div>${tabela}`;
  };
  window.selectDefectMonth=function(m){window.selectedDefectMonth=m;render_formularios_defeito();};

  const oldCarregarDefeitos = window.carregarDefeitosSupabase;
  window.carregarDefeitosSupabase = async function(){
    if(typeof oldCarregarDefeitos==='function') await oldCarregarDefeitos();
    if(!Array.isArray(data.formularios_defeito) || data.formularios_defeito.length===0) ensureDefectSeeds(true);
    if(currentPage==='formularios_defeito') render_formularios_defeito();
    if(typeof renderNav==='function') renderNav();
  };

  function getMultaLabel(m){return `${m.id||''} • ${m.placa||'-'} • ${m.motorista||'-'} • Auto ${m.auto||'-'} • ${fmtDate(m.data)}`;}
  function inferGrav(m){
    const t=norm([m.gravidade,m.infracao,m.descricao,m.obs].join(' '));
    if(t.includes('gravissima')) return 'Gravíssima';
    if(t.includes('grave')) return 'Grave';
    if(t.includes('media')) return 'Média';
    if(t.includes('leve')) return 'Leve';
    return 'Média';
  }
  function pts(g){const n=norm(g); return n.includes('gravissima')?7:n.includes('grave')?5:n.includes('media')?4:n.includes('leve')?3:4;}
  window.openPontoFromMultaModal=function(){
    const multas=(data.multas||[]).slice().sort((a,b)=>Number(b.id||0)-Number(a.id||0));
    document.getElementById('modalTitle').textContent='Selecionar multa';
    document.getElementById('modalBody').innerHTML=`<div class="field full"><label>Selecionar multa</label><select id="multaParaPonto">${multas.map(m=>`<option value="${m.id}">${esc(getMultaLabel(m))}</option>`).join('')}</select></div><div id="multaPontoPreview" class="empty" style="margin-top:12px;text-align:left;"></div>`;
    document.querySelector('.modal-foot').innerHTML='<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="lancarPontoDaMultaSelecionada()">Lançar ponto</button>';
    window.modalCtx={key:'ponto_multa_select',itemId:null};
    document.getElementById('modalBg').classList.add('open');
    const sel=document.getElementById('multaParaPonto');
    sel.onchange=previewPontoDaMulta; previewPontoDaMulta();
  };
  window.previewPontoDaMulta=function(){
    const idSel=document.getElementById('multaParaPonto')?.value;
    const m=(data.multas||[]).find(x=>String(x.id)===String(idSel));
    if(!m) return;
    const g=inferGrav(m); const p=pts(g);
    document.getElementById('multaPontoPreview').innerHTML=`<b>Dados que serão lançados:</b><br><br><b>Motorista:</b> ${esc(m.motorista||'-')}<br><b>Placa:</b> ${esc(m.placa||'-')}<br><b>Auto:</b> ${esc(m.auto||'-')}<br><b>Data:</b> ${fmtDate(m.data)}<br><b>Gravidade:</b> ${esc(g)}<br><b>Pontos:</b> ${p}`;
  };
  window.lancarPontoDaMultaSelecionada=async function(){
    const idSel=document.getElementById('multaParaPonto')?.value;
    const m=(data.multas||[]).find(x=>String(x.id)===String(idSel));
    if(!m) return alert('Selecione uma multa.');
    if(typeof sincronizarPontoDaMulta==='function'){
      const res=await sincronizarPontoDaMulta(m);
      closeModal();
      toast(res?.novo?'Ponto vinculado à multa lançado.':'Ponto vinculado à multa atualizado.');
      showPage('pontos');
      return;
    }
    const g=inferGrav(m); const p=pts(g);
    if(!data.pontos) data.pontos=[];
    data.pontos.push({id:Date.now(),motorista:m.motorista||'',data:m.data||'',placa:m.placa||'',auto:m.auto||'',gravidade:g,pontos:p,aceitou:'Pendente',multa_id:m.id,origem:'multa vinculada'});
    closeModal(); toast('Ponto vinculado à multa lançado.'); showPage('pontos');
  };

  const oldRenderPontos=window.render_pontos || (typeof render_pontos==='function'?render_pontos:null);
  window.render_pontos=function(){
    if(typeof oldRenderPontos==='function') oldRenderPontos();
    setActions(`<button class="btn primary" onclick="openPontoFromMultaModal()">+ Lançar ponto</button><button class="btn" onclick="openForm('pontos')">Lançar manual</button>`);
  };

  const oldClose=window.closeModal;
  window.closeModal=function(){
    document.querySelector('.modal-foot').innerHTML='<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveModal()">Salvar</button>';
    return oldClose.apply(this,arguments);
  };

  if(window.schemas && Array.isArray(schemas.pontos)){
    if(!schemas.pontos.some(c=>c[0]==='multa_id')) schemas.pontos.push(['multa_id','ID da multa vinculada','number']);
  }
  ensureDefectSeeds();
  if(typeof renderNav==='function') renderNav();
})();
</script>

<script id="producao-dia-pastas-ajuste-luiz-js">
/* Ajustes: editar/excluir pastas de Produção do Dia + formulário de lançamento melhorado. */
(function(){
  const oldOpenForm = window.openForm || openForm;
  const oldCloseModal = window.closeModal || closeModal;
  const oldSaveModal = window.saveModal || saveModal;

  function prodMonths(){
    const fromFolders=(data.producaoMeses||[]).map(x=>String(x.mes||'')).filter(Boolean);
    const fromRows=(data.producao||[]).map(x=>String(x.mes||ym(x.data)||'')).filter(Boolean);
    return [...new Set([...fromFolders,...fromRows])].filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
  }
  function ensureMonth(m){
    if(/^\d{4}-\d{2}$/.test(m||'') && !data.producaoMeses.some(x=>x.mes===m)){
      data.producaoMeses.push({mes:m});
    }
  }
  function monthInputValue(){
    const d=new Date(), mm=String(d.getMonth()+1).padStart(2,'0');
    return `${d.getFullYear()}-${mm}`;
  }

  window.render_producao=function(){
    setActions('<button class="btn" onclick="openAddMonth()">+ Nova pasta</button><button class="btn primary" onclick="openForm(\'producao\')">+ Adicionar dia</button>');
    const months=prodMonths();
    const selected=(typeof folderSel!=='undefined' ? folderSel.producao : selectedProdMonth)||'';
    const rowsSel=data.producao.filter(r=>!selected||r.mes===selected);
    document.getElementById('producao').innerHTML=
      stats([
        ['Pastas',months.length,'meses'],
        ['Lançamentos',data.producao.length,'registros'],
        ['Veículos únicos',new Set(data.producao.map(x=>x.placa)).size,'sem duplicar placa'],
        ['Selecionado',selected?monthName(selected):'Todos','pasta atual']
      ])+
      `<div class="prod-folder-create"><small>Selecione uma pasta para filtrar. Use ✎ para renomear e × para excluir pastas criadas.</small><button class="btn" onclick="openAddMonth()">+ Criar pasta</button></div>`+
      `<div class="prod-folder-grid">
        <div class="prod-folder-card ${!selected?'active':''}">
          <button class="prod-folder-main" onclick="selectProdFolder('')"><div class="folder-icon">📁</div><strong>Todos os meses</strong><small>${data.producao.length} lançamentos • ${new Set(data.producao.map(r=>r.placa)).size} veículos únicos</small></button>
        </div>
        ${months.map(m=>{
          const rows=data.producao.filter(r=>r.mes===m), unique=new Set(rows.map(r=>r.placa)).size;
          return `<div class="prod-folder-card ${selected===m?'active':''}">
            <button class="prod-folder-main" onclick="selectProdFolder('${m}')"><div class="folder-icon">📁</div><strong>${monthName(m)}</strong><small>${rows.length} lançamentos • ${unique} veículos únicos</small></button>
            <div class="prod-folder-tools"><button class="icon-btn" title="Editar pasta" onclick="editProdMonth('${m}')">✎</button><button class="icon-btn danger" title="Excluir pasta" onclick="deleteProdMonth('${m}')">×</button></div>
          </div>`;
        }).join('')}
      </div>`+
      filterHtml('prodSearch','Buscar placa, serviço, responsável...')+`<div id="prodInfo"></div>`;
    const input=document.getElementById('prodSearch'); if(input) input.oninput=renderProdInfo;
    renderProdInfo();
  };

  window.selectProdFolder=function(m){
    if(typeof folderSel!=='undefined') folderSel.producao=m;
    selectedProdMonth=m;
    render_producao();
    setTimeout(()=>document.getElementById('prodInfo')?.scrollIntoView({behavior:'smooth',block:'start'}),40);
  };
  window.selectProdMonth=window.selectProdFolder;

  window.renderProdInfo=function(){
    const selected=(typeof folderSel!=='undefined' ? folderSel.producao : selectedProdMonth)||'';
    const q=clean(document.getElementById('prodSearch')?.value||'');
    const rows=data.producao
      .filter(r=>(!selected||r.mes===selected)&&(!q||clean(Object.values(r).join(' ')).includes(q)))
      .sort((a,b)=>String(b.data||'').localeCompare(String(a.data||''))||Number(b.id||0)-Number(a.id||0));
    const el=document.getElementById('prodInfo'); if(!el) return;
    el.innerHTML=table(selected?`Produção — ${monthName(selected)}`:'Produção — Todos os meses',
      ['Data','Pasta/Mês','Placa','Serviço','Responsável','Observação','Anexo','Ações'],
      rows.map(r=>`<tr><td>${fmtDate(r.data)}</td><td>${monthName(r.mes)}</td><td><span class="plate">${esc(r.placa||'-')}</span></td><td>${esc(r.servico||'-')}</td><td>${esc(r.responsavel||'-')}</td><td>${esc(r.obs||'-')}</td><td>${r.anexo?`<button class="icon-btn" onclick="window.open('${esc(r.anexo)}','_blank')">↗</button>`:'-'}</td><td class="row-actions"><button class="icon-btn" onclick="openForm('producao',${r.id})">✎</button><button class="icon-btn" onclick="removeItem('producao',${r.id})">×</button></td></tr>`).join(''));
  };

  window.openAddMonth=function(){
    const m=prompt('Digite o mês da pasta no formato AAAA-MM:', (typeof folderSel!=='undefined' && folderSel.producao) || selectedProdMonth || monthInputValue());
    if(m===null) return;
    if(!/^\d{4}-\d{2}$/.test(m)){alert('Use o formato AAAA-MM, por exemplo: 2026-06.');return;}
    ensureMonth(m);
    if(typeof folderSel!=='undefined') folderSel.producao=m;
    selectedProdMonth=m;
    toast('Pasta criada.');
    render_producao();
  };

  window.editProdMonth=function(oldMes){
    const novo=prompt('Novo mês da pasta no formato AAAA-MM:', oldMes);
    if(novo===null) return;
    if(!/^\d{4}-\d{2}$/.test(novo)){alert('Use o formato AAAA-MM, por exemplo: 2026-06.');return;}
    if(novo===oldMes) return;
    if(prodMonths().includes(novo) && !confirm('Já existe uma pasta com esse mês. Deseja juntar os lançamentos nela?')) return;
    data.producao.forEach(r=>{ if(r.mes===oldMes) r.mes=novo; });
    data.producaoMeses=(data.producaoMeses||[]).filter(x=>x.mes!==oldMes);
    ensureMonth(novo);
    if(typeof folderSel!=='undefined' && folderSel.producao===oldMes) folderSel.producao=novo;
    if(selectedProdMonth===oldMes) selectedProdMonth=novo;
    toast('Pasta atualizada.');
    render_producao();
  };

  window.deleteProdMonth=function(mes){
    const qtd=data.producao.filter(r=>r.mes===mes).length;
    const msg=qtd ? `Esta pasta tem ${qtd} lançamento(s). Excluir a pasta também removerá esses lançamentos. Continuar?` : 'Excluir esta pasta?';
    if(!confirm(msg)) return;
    data.producao=data.producao.filter(r=>r.mes!==mes);
    data.producaoMeses=(data.producaoMeses||[]).filter(x=>x.mes!==mes);
    if(typeof folderSel!=='undefined' && folderSel.producao===mes) folderSel.producao='';
    if(selectedProdMonth===mes) selectedProdMonth='';
    toast('Pasta excluída.');
    render_producao();
  };

  window.openForm=function(key,itemId=null){
    if(key!=='producao') return oldOpenForm(key,itemId);
    modalCtx={key,itemId};
    const selected=(typeof folderSel!=='undefined' ? folderSel.producao : selectedProdMonth)||'';
    const item=itemId?(data.producao.find(x=>x.id===itemId)||{}):{mes:selected,data:'',placa:'',servico:'',responsavel:'',obs:'',anexo:''};
    const months=prodMonths();
    const opts=[...new Set([item.mes,selected,...months].filter(Boolean))];
    document.getElementById('modalTitle').textContent=(itemId?'Editar lançamento':'Adicionar produção do dia');
    document.querySelector('#modalBg .modal')?.classList.add('producao-modal');
    document.getElementById('modalBody').innerHTML=`<div class="form-grid">
      <div class="producao-help">Lançamento da produção do dia<span>A pasta/mês agora é uma seleção. Se deixar em branco, o sistema usa automaticamente o mês da data informada.</span></div>
      <div class="field"><label>Pasta/Mês</label><select id="f_mes"><option value="">Usar mês da data</option>${opts.map(m=>`<option value="${esc(m)}" ${String(item.mes||selected)===m?'selected':''}>${monthName(m)}</option>`).join('')}</select></div>
      <div class="field"><label>Data</label><input id="f_data" type="date" value="${esc(item.data||'')}"></div>
      <div class="field"><label>Placa</label><input id="f_placa" type="text" placeholder="Ex.: ABC1D23" value="${esc(item.placa||'')}"></div>
      <div class="field"><label>Responsável</label><input id="f_responsavel" type="text" value="${esc(item.responsavel||'')}"></div>
      <div class="field full"><label>Serviço</label><textarea id="f_servico" placeholder="Descreva o serviço feito no dia">${esc(item.servico||'')}</textarea></div>
      <div class="field full"><label>Observação</label><textarea id="f_obs" placeholder="Informações extras, origem do lançamento etc.">${esc(item.obs||'')}</textarea></div>
      <div class="field full"><label>Anexo/Comprovante</label><input id="f_anexo" type="text" placeholder="Cole um link ou nome do arquivo" value="${esc(item.anexo||'')}"></div>
    </div>`;
    document.getElementById('modalBg').classList.add('open');
  };

  window.saveModal=async function(){
    if(!modalCtx || modalCtx.key!=='producao') return oldSaveModal();
    const itemId=modalCtx.itemId;
    const obj=itemId?(data.producao.find(x=>x.id===itemId)||{}):{id:id()};
    obj.data=document.getElementById('f_data').value;
    obj.mes=document.getElementById('f_mes').value || ym(obj.data);
    obj.placa=(document.getElementById('f_placa').value||'').toUpperCase();
    obj.responsavel=document.getElementById('f_responsavel').value;
    obj.servico=document.getElementById('f_servico').value;
    obj.obs=document.getElementById('f_obs').value;
    obj.anexo=document.getElementById('f_anexo').value;
    if(!/^\d{4}-\d{2}$/.test(obj.mes||'')){alert('Informe a pasta/mês ou preencha a data para o sistema definir o mês.');return;}
    ensureMonth(obj.mes);
    if(!itemId) data.producao.push(obj);
    if(typeof folderSel!=='undefined') folderSel.producao=obj.mes;
    selectedProdMonth=obj.mes;
    closeModal();
    toast('Produção salva.');
    showPage(currentPage);
  };

  window.closeModal=function(){
    document.querySelector('#modalBg .modal')?.classList.remove('producao-modal');
    oldCloseModal();
  };
})();
</script>

<script id="manutencoes-pastas-editaveis-js">
(function(){
  const oldRenderManutencoes = window.render_manutencoes || render_manutencoes;
  const oldRenderManList = window.renderManList || renderManList;
  const oldOpenFormMan = window.openForm;
  const oldSaveModalMan = window.saveModal;
  const oldCloseModalMan = window.closeModal;

  function uniqueManMonths(){
    const saved=(data.manutencoesMeses||[]).map(x=>typeof x==='string'?x:x.mes).filter(Boolean);
    const fromRows=(data.manutencoes||[]).map(r=>ym(r.data)).filter(Boolean);
    const all=[...new Set([...saved,...fromRows])].filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
    data.manutencoesMeses=all.map(m=>({mes:m}));
    return all;
  }
  function ensureManMonth(m){
    if(!/^\d{4}-\d{2}$/.test(m||'')) return false;
    const months=uniqueManMonths();
    if(!months.includes(m)) data.manutencoesMeses.push({mes:m});
    return true;
  }
  function rowsManMonth(m){return (data.manutencoes||[]).filter(r=>!m||ym(r.data)===m)}
  function safeMonthDate(oldDate,newMes){
    const day=/^\d{4}-\d{2}-\d{2}$/.test(oldDate||'')?oldDate.slice(8,10):'01';
    const last=new Date(Number(newMes.slice(0,4)), Number(newMes.slice(5,7)), 0).getDate();
    return `${newMes}-${String(Math.min(Number(day)||1,last)).padStart(2,'0')}`;
  }

  window.openAddManMonth=function(){
    const m=prompt('Digite a pasta no formato AAAA-MM:', selectedManMonth || new Date().toISOString().slice(0,7));
    if(m===null) return;
    if(!/^\d{4}-\d{2}$/.test(m)){alert('Use o formato AAAA-MM.');return;}
    ensureManMonth(m);
    selectedManMonth=m;
    toast('Pasta de manutenção criada.');
    render_manutencoes();
  };

  window.editManMonth=function(oldMes){
    if(!oldMes){alert('A pasta "Todos os meses" não pode ser editada.');return;}
    const novo=prompt('Editar pasta/mês:', oldMes);
    if(novo===null) return;
    if(!/^\d{4}-\d{2}$/.test(novo)){alert('Use o formato AAAA-MM.');return;}
    if(novo===oldMes) return;
    const qtd=rowsManMonth(oldMes).length;
    const ok=confirm(`Mover ${qtd} manutenção(ões) de ${monthName(oldMes)} para ${monthName(novo)}?`);
    if(!ok) return;
    data.manutencoes.forEach(r=>{ if(ym(r.data)===oldMes) r.data=safeMonthDate(r.data,novo); });
    data.manutencoesMeses=(data.manutencoesMeses||[]).filter(x=>(typeof x==='string'?x:x.mes)!==oldMes);
    ensureManMonth(novo);
    selectedManMonth=novo;
    toast('Pasta de manutenção editada.');
    render_manutencoes();
  };

  window.deleteManMonth=function(mes){
    if(!mes){alert('A pasta "Todos os meses" não pode ser excluída.');return;}
    const qtd=rowsManMonth(mes).length;
    if(!confirm(`Excluir a pasta ${monthName(mes)} e ${qtd} manutenção(ões) dentro dela?`)) return;
    data.manutencoes=data.manutencoes.filter(r=>ym(r.data)!==mes);
    data.manutencoesMeses=(data.manutencoesMeses||[]).filter(x=>(typeof x==='string'?x:x.mes)!==mes);
    if(selectedManMonth===mes) selectedManMonth='';
    toast('Pasta de manutenção excluída.');
    render_manutencoes();
  };

  window.manutencoesFoldersHtml=function(){
    const meses=uniqueManMonths();
    const folders=['',...meses];
    return `<div class="folders">${folders.map(m=>{
      const rows=rowsManMonth(m);
      const total=rows.reduce((s,r)=>s+Number(r.valor||0),0);
      const unique=new Set(rows.map(r=>r.placa).filter(Boolean)).size;
      return `<div class="folder editable-folder ${selectedManMonth===m?'active':''}">
        <div class="folder-main" onclick="selectManMonth('${m}')">
          <div class="folder-icon">📁</div>
          <strong>${m?monthName(m):'Todos os meses'}<span class="folder-count">${rows.length}</span></strong>
          <small>${rows.length} registros • ${unique} veículos</small>
          <small class="warn">Total: ${BRL(total)}</small>
        </div>
        ${m?`<div class="folder-card-actions"><button class="icon-btn" title="Editar pasta" onclick="event.stopPropagation();editManMonth('${m}')">✎</button><button class="icon-btn danger" title="Excluir pasta" onclick="event.stopPropagation();deleteManMonth('${m}')">×</button></div>`:''}
      </div>`;
    }).join('')}</div>`;
  };

  window.render_manutencoes=function(){
    uniqueManMonths();
    setActions('<button class="btn" onclick="openAddManMonth()">+ Pasta/mês</button><button class="btn primary" onclick="openForm(\'manutencoes\')">+ Nova manutenção</button>');
    const rows=rowsManMonth(selectedManMonth);
    const total=rows.reduce((s,r)=>s+Number(r.valor||0),0);
    const ticket=rows.length?total/rows.length:0;
    document.getElementById('manutencoes').innerHTML=stats([
      ['Registros',rows.length,selectedManMonth?'no mês selecionado':'total de serviços'],
      ['Valor',BRL(total),selectedManMonth?'total do mês':'total geral'],
      ['Ticket médio',BRL(ticket),'valor médio por serviço'],
      ['Selecionado',selectedManMonth?monthName(selectedManMonth):'Todos','pasta atual']
    ])+manutencoesFoldersHtml()+filterHtml('manSearch','Buscar placa, tipo, origem ou descrição...')+`<div id="manTable"></div>`;
    document.getElementById('manSearch').oninput=renderManList;
    renderManList();
  };

  window.openForm=function(key,itemId=null){
    if(key!=='manutencoes') return oldOpenFormMan(key,itemId);
    modalCtx={key,itemId};
    const selected=selectedManMonth||'';
    const item=itemId?(data.manutencoes.find(x=>x.id===itemId)||{}):{data:selected?selected+'-01':'',placa:'',tipo:'',origem:'',descricao:'',valor:0,status:'concluido',anexo:''};
    const itemMes=ym(item.data)||selected;
    const months=[...new Set([itemMes,selected,...uniqueManMonths()].filter(Boolean))];
    document.getElementById('modalTitle').textContent=(itemId?'Editar manutenção':'Adicionar manutenção');
    document.querySelector('#modalBg .modal')?.classList.add('manutencao-modal');
    document.getElementById('modalBody').innerHTML=`<div class="form-grid">
      <div class="man-help">Cadastro de manutenção<span>Escolha a pasta/mês e preencha a data do serviço. Ao mudar a pasta, o registro entra automaticamente no mês selecionado.</span></div>
      <div class="field"><label>Pasta/Mês</label><select id="f_man_mes"><option value="">Usar mês da data</option>${months.map(m=>`<option value="${esc(m)}" ${itemMes===m?'selected':''}>${monthName(m)}</option>`).join('')}</select></div>
      <div class="field"><label>Data</label><input id="f_data" type="date" value="${esc(item.data||'')}"></div>
      <div class="field"><label>Placa</label><input id="f_placa" type="text" value="${esc(item.placa||'')}" placeholder="Ex.: ABC1D23"></div>
      <div class="field"><label>Tipo/peça</label><input id="f_tipo" type="text" value="${esc(item.tipo||'')}"></div>
      <div class="field"><label>Origem</label><input id="f_origem" type="text" value="${esc(item.origem||'')}"></div>
      <div class="field"><label>Valor</label><input id="f_valor" type="number" step="0.01" value="${esc(item.valor||0)}"></div>
      <div class="field"><label>Status</label><select id="f_status"><option value="concluido" ${String(item.status||'concluido')==='concluido'?'selected':''}>Concluído</option><option value="pendente" ${String(item.status||'')==='pendente'?'selected':''}>Pendente</option></select></div>
      <div class="field full"><label>Descrição</label><textarea id="f_descricao" placeholder="Descreva o serviço realizado">${esc(item.descricao||'')}</textarea></div>
      <div class="field full"><label>Anexo/Comprovante</label><input id="f_anexo" type="text" placeholder="Cole um link ou nome do arquivo" value="${esc(item.anexo||'')}"></div>
    </div>`;
    document.getElementById('modalBg').classList.add('open');
  };

  window.saveModal=async function(){
    if(!modalCtx || modalCtx.key!=='manutencoes') return oldSaveModalMan();
    const itemId=modalCtx.itemId;
    const obj=itemId?(data.manutencoes.find(x=>x.id===itemId)||{}):{id:id()};
    let dataServico=document.getElementById('f_data').value;
    const mesEscolhido=document.getElementById('f_man_mes').value;
    if(mesEscolhido){ dataServico=safeMonthDate(dataServico||`${mesEscolhido}-01`,mesEscolhido); }
    obj.data=dataServico;
    obj.placa=(document.getElementById('f_placa').value||'').toUpperCase();
    obj.tipo=document.getElementById('f_tipo').value;
    obj.origem=document.getElementById('f_origem').value;
    obj.descricao=document.getElementById('f_descricao').value;
    obj.valor=Number(document.getElementById('f_valor').value||0);
    obj.status=document.getElementById('f_status').value;
    obj.anexo=document.getElementById('f_anexo').value;
    const m=ym(obj.data);
    if(!m){alert('Preencha a data ou escolha uma pasta/mês.');return;}
    ensureManMonth(m);
    if(!itemId) data.manutencoes.push(obj);
    selectedManMonth=m;
    closeModal();
    toast('Manutenção salva.');
    showPage(currentPage);
  };

  window.closeModal=function(){
    document.querySelector('#modalBg .modal')?.classList.remove('manutencao-modal');
    oldCloseModalMan();
  };
})();
</script>





<script id="fix-sync-multas-final">
(function(){
  const previousSaveModal = window.saveModal;

  async function saveMultaDiretoSupabase(){
    const ctx = (typeof modalCtx !== 'undefined' && modalCtx) ? {...modalCtx} : null;
    if(!ctx || ctx.key !== 'multas') return false;

    const itemId = ctx.itemId;
    let obj = itemId ? (data.multas || []).find(x => String(x.id) === String(itemId)) : null;
    if(!obj) obj = { id: (typeof id === 'function' ? id() : Date.now()) };

    (schemas.multas || []).forEach(([prop,,type]) => {
      const el = document.getElementById('f_' + prop);
      if(!el) return;
      let v = el.value;
      if(type === 'number') v = Number(v || 0);
      if(prop === 'placa') v = String(v || '').toUpperCase();
      obj[prop] = v;
    });

    try{
      await salvarMultaSupabase(obj);
      const idx = (data.multas || []).findIndex(x => String(x.id) === String(obj.id));
      if(idx >= 0) data.multas[idx] = obj;
      else data.multas.unshift(obj);

      if(typeof sincronizarPontoDaMulta === 'function'){
        await sincronizarPontoDaMulta(obj).catch(console.warn);
      }

      if(typeof closeModal === 'function') closeModal();
      if(typeof toast === 'function') toast('Multa salva no Supabase.');
      if(typeof renderNav === 'function') renderNav();
      if(typeof showPage === 'function') showPage(currentPage || 'multas');
      return true;
    }catch(e){
      console.error('Erro ao salvar multa no Supabase:', e);
      alert('Erro ao salvar multa no Supabase: ' + (e.message || e));
      return true;
    }
  }

  async function saveModalFinal(){
    const ctx = (typeof modalCtx !== 'undefined' && modalCtx) ? {...modalCtx} : null;
    if(ctx && ctx.key === 'multas') return saveMultaDiretoSupabase();
    return previousSaveModal.apply(this, arguments);
  }

  window.saveModal = saveModalFinal;
  try { saveModal = saveModalFinal; } catch(e) {}

  const previousRemoveItem = window.removeItem;
  async function removeItemFinal(key,itemId){
    if(key !== 'multas') return previousRemoveItem.apply(this, arguments);
    if(!confirm('Excluir esta multa?')) return;
    try{
      await removerMultaSupabase(itemId);
      data.multas = (data.multas || []).filter(x => String(x.id) !== String(itemId));
      if(typeof toast === 'function') toast('Multa excluída do Supabase.');
      if(typeof renderNav === 'function') renderNav();
      if(typeof showPage === 'function') showPage(currentPage || 'multas');
    }catch(e){
      console.error('Erro ao excluir multa no Supabase:', e);
      alert('Erro ao excluir multa no Supabase: ' + (e.message || e));
    }
  }

  window.removeItem = removeItemFinal;
  try { removeItem = removeItemFinal; } catch(e) {}

  async function atualizarMultasQuandoAberto(){
    if(document.hidden) return;
    if(!['multas','dashboard','pontos','motoristas'].includes(currentPage || '')) return;
    if(typeof carregarMultasSupabase === 'function') await carregarMultasSupabase().catch(console.warn);
  }

  window.addEventListener('focus', atualizarMultasQuandoAberto);
  document.addEventListener('visibilitychange', atualizarMultasQuandoAberto);
  setInterval(atualizarMultasQuandoAberto, 20000);
})();
</script>



<script id="fix-definitivo-multas-sem-descricao-cache">
(function(){
  const CAMPOS_MULTAS_SUPABASE = [
    'id','linha','carro','placa','data','hora','local','municipio','infracao','auto',
    'motorista','valor','assinado','pago','envio_rca','prazo_aceite','dp','status','obs','data_suspeita'
  ];

  function montarPayloadMultaSeguro(r){
    r = r || {};
    const status = (typeof statusMulta === 'function' ? statusMulta(r.status) : r.status) ||
                   (typeof inferStatusMulta === 'function' ? inferStatusMulta(r) : 'aguardando_aceite');
    const payload = {
      id: Number(r.id),
      linha: String(r.linha ?? 'manual'),
      carro: r.placa || r.carro || '',
      placa: r.placa || r.carro || '',
      data: r.data || '',
      hora: r.hora || '',
      local: r.local || '',
      municipio: r.municipio || '',
      infracao: r.infracao || '',
      auto: r.auto || '',
      motorista: r.motorista || 'S/N',
      valor: Number(r.valor || 0),
      assinado: r.assinado || '',
      pago: r.pago || '',
      envio_rca: r.envioRCA || r.envio_rca || '',
      prazo_aceite: r.prazo || r.prazo_aceite || '',
      dp: r.dp || '',
      status: status,
      obs: r.obs || '',
      data_suspeita: !!(r.dataSuspeita || r.data_suspeita)
    };

    // Garante que NUNCA vá descricao/descricao_multa para a tabela multas.
    Object.keys(payload).forEach(k => { if(!CAMPOS_MULTAS_SUPABASE.includes(k)) delete payload[k]; });
    return payload;
  }

  async function salvarMultaSupabaseSeguro(obj){
    const db = typeof connectSupabase === 'function' ? connectSupabase() : null;
    if(!db) return false;

    const payload = montarPayloadMultaSeguro(obj);
    console.log('Payload seguro enviado para multas:', Object.keys(payload));

    const { error } = await db.from('multas').upsert(payload, { onConflict: 'id' });
    if(error) throw error;

    // Atualiza o objeto local sem depender do SELECT do Supabase.
    Object.assign(obj, {
      id: payload.id,
      linha: payload.linha,
      placa: payload.placa,
      data: payload.data,
      hora: payload.hora,
      local: payload.local,
      municipio: payload.municipio,
      infracao: payload.infracao,
      auto: payload.auto,
      motorista: payload.motorista,
      valor: payload.valor,
      assinado: payload.assinado,
      pago: payload.pago,
      envioRCA: payload.envio_rca,
      prazo: payload.prazo_aceite,
      dp: payload.dp,
      status: payload.status,
      obs: payload.obs,
      dataSuspeita: payload.data_suspeita
    });
    return true;
  }

  window.salvarMultaSupabase = salvarMultaSupabaseSeguro;
  try { salvarMultaSupabase = salvarMultaSupabaseSeguro; } catch(e) {}
})();
</script>



<script id="fix-pastas-sem-sumir-e-acoes">
(function(){
  function arrSafe(key){ if(!data[key]) data[key]=[]; return data[key]; }
  function mesProp(key){ return key==='tacografos' ? 'validade' : 'data'; }
  function listaMeses(months){
    return [...new Set((months||[]).map(m=>typeof m==='string'?m:(m&&m.mes)).filter(Boolean))].sort();
  }
  function manterDia(dataAntiga, novoMes){
    const antiga=String(dataAntiga||'');
    const dia=/^\d{4}-\d{2}-\d{2}$/.test(antiga) ? Number(antiga.slice(8,10)) : 1;
    const ultimo=new Date(Number(novoMes.slice(0,4)), Number(novoMes.slice(5,7)), 0).getDate();
    return `${novoMes}-${String(Math.min(dia,ultimo)).padStart(2,'0')}`;
  }
  async function salvarLinha(key, r){
    if(typeof window.salvarRegistroSupabase==='function'){
      try{ await window.salvarRegistroSupabase(key,r); }catch(e){ console.warn(e); }
    }
  }
  async function excluirLinha(key, id){
    if(typeof window.excluirRegistroSupabase==='function'){
      try{ await window.excluirRegistroSupabase(key,id); }catch(e){ console.warn(e); }
    }
  }

  window.editarPastaModulo = async function(key, oldMes){
    const novoMes = prompt('Novo mês da pasta no formato AAAA-MM:', oldMes || '');
    if(!novoMes) return;
    if(!/^\d{4}-\d{2}$/.test(novoMes)){ alert('Use o formato AAAA-MM. Exemplo: 2026-06'); return; }
    const prop = mesProp(key);
    const linhas = arrSafe(key).filter(r=>ym(r[prop]||r.data||'')===oldMes);
    for(const r of linhas){
      r[prop]=manterDia(r[prop]||r.data, novoMes);
      if(key==='producao') r.mes=novoMes;
      await salvarLinha(key,r);
    }
    if(key==='producao' && Array.isArray(data.producaoMeses)){
      data.producaoMeses=data.producaoMeses.map(x=>(typeof x==='string'?x:x.mes)===oldMes?{mes:novoMes}:x);
    }
    if(key==='manutencoes' && Array.isArray(data.manutencoesMeses)){
      data.manutencoesMeses=data.manutencoesMeses.map(x=>(typeof x==='string'?x:x.mes)===oldMes?{mes:novoMes}:x);
    }
    folderSel[key]=novoMes;
    showPage(currentPage);
    toast('Pasta editada sem apagar as outras.');
  };

  window.excluirPastaModulo = async function(key, mes){
    if(!confirm(`Excluir a pasta ${monthName(mes)}? Isso apaga só os registros desse mês.`)) return;
    const prop = mesProp(key);
    const linhas = arrSafe(key).filter(r=>ym(r[prop]||r.data||'')===mes);
    for(const r of linhas){ await excluirLinha(key,r.id); }
    data[key]=arrSafe(key).filter(r=>ym(r[prop]||r.data||'')!==mes);
    if(key==='producao' && Array.isArray(data.producaoMeses)) data.producaoMeses=data.producaoMeses.filter(x=>(typeof x==='string'?x:x.mes)!==mes);
    if(key==='manutencoes' && Array.isArray(data.manutencoesMeses)) data.manutencoesMeses=data.manutencoesMeses.filter(x=>(typeof x==='string'?x:x.mes)!==mes);
    if(folderSel[key]===mes) folderSel[key]='';
    showPage(currentPage);
    toast('Pasta excluída. As outras foram preservadas.');
  };

  window.folderHtmlEmpresa = function(key, months){
    const current=folderSel[key]||'';
    const cards=[{mes:'',label:'Todos os meses'}, ...listaMeses(months).map(m=>({mes:m,label:monthName(m)}))];
    return `<div class="folders">${cards.map(f=>{
      const acoes = f.mes ? `<div class="folder-actions" onclick="event.stopPropagation()"><button type="button" class="icon-btn" title="Editar pasta" onclick="editarPastaModulo('${key}','${f.mes}')">✎</button><button type="button" class="icon-btn" title="Excluir pasta" onclick="excluirPastaModulo('${key}','${f.mes}')">×</button></div>` : '';
      return `<div class="folder ${current===f.mes?'active':''}" role="button" tabindex="0" onclick="selectFolderEmpresa('${key}','${f.mes}')">${acoes}<div class="folder-icon">📁</div><strong>${f.label}</strong><small>${folderCountEmpresa(key,f.mes)}</small></div>`;
    }).join('')}</div>`;
  };
})();
</script>

    const ativos=rows.filter(r=>statusNorm(r.status)==='ativo');
    const manut=rows.filter(r=>statusNorm(r.status)==='manutencao');

    if(selected==='todos'){
      html=`<div class="vehicle-split-grid">${vehicleTable('Veículos ativos',ativos,'Nenhum veículo ativo encontrado.')}${vehicleTable('Veículos em manutenção',manut,'Nenhum veículo em manutenção encontrado.')}${inativos.length?vehicleTable('Veículos inativos',inativos,''):''}</div>`;
    }else if(selected==='ativo') html=vehicleTable('Veículos ativos',ativos,'Nenhum veículo ativo encontrado.');
    else if(selected==='manutencao') html=vehicleTable('Veículos em manutenção',manut,'Nenhum veículo em manutenção encontrado.');
