    const target=document.getElementById('veiculosTable'); if(target) target.innerHTML=html;
  };
})();
</script>



<script id="sync-supabase-seguro-final-luiz">
(function(){
  'use strict';
  const TABLES = {
    motoristas:['motoristas'],
    veiculos:['veiculos'],
    tacografos:['tacografos','tacografo'],
    oleo:['oleo','troca_oleo','troca_de_oleo'],
    manutencoes:['manutencoes','manutencao'],
    producao:['producao','producao_dia'],
    pontos:['pontos'],
    producaoMeses:['producao_meses','pastas_producao'],
    manutencoesMeses:['manutencoes_meses','pastas_manutencoes']
  };
  const SYNC_KEYS=['motoristas','veiculos','tacografos','oleo','manutencoes','producao','pontos'];
  const cache={};
  const oldSaveModal = window.saveModal || saveModal;
  const oldRemoveItem = window.removeItem || removeItem;

  function db(){ try{return typeof connectSupabase==='function'?connectSupabase():null;}catch(e){return null;} }
  function say(m){ try{ if(typeof toast==='function') toast(m); }catch(e){} }
  function num(v){ const n=Number(v||0); return Number.isFinite(n)?n:0; }
  function date(v){ v=String(v||''); return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:null; }
  function norm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
  function upper(s){ return String(s||'').toUpperCase(); }
  function arr(key){ if(!data[key]) data[key]=[]; return data[key]; }

  async function tableFor(key){
    if(cache[key]) return cache[key];
    const c=db(); if(!c) return null;
    for(const t of (TABLES[key]||[key])){
      try{ const {error}=await c.from(t).select('id').limit(1); if(!error){ cache[key]=t; return t; } }catch(e){}
    }
    return null;
  }
  function rowToApp(key,r){
    const o={...(r||{})}; delete o.created_at; delete o.updated_at;
    if(o.id!==undefined) o.id=Number(o.id);
    if(key==='oleo'){ o.proxKm=num(o.proxKm??o.proxkm??o.prox_km); o.km=num(o.km); delete o.proxkm; delete o.prox_km; }
    if(key==='motoristas'){ o.cnhArquivo=o.cnhArquivo||o.cnharquivo||''; o.pontos=num(o.pontos); delete o.cnharquivo; }
    if(key==='manutencoes') o.valor=num(o.valor);
    if(key==='pontos') o.pontos=num(o.pontos);
    return o;
  }
  function payload(key,o){
    o=o||{};
    const p={id:Number(o.id || (typeof id==='function'?id():Date.now()))};
    if(key==='motoristas') Object.assign(p,{nome:o.nome||'',funcao:o.funcao||'',departamento:o.departamento||'',cpf:o.cpf||'',cnh:o.cnh||'',categoria:o.categoria||'',validade:date(o.validade),status:o.status||'ativo',cnharquivo:o.cnhArquivo||o.cnharquivo||'',pontos:num(o.pontos)});
    if(key==='veiculos') Object.assign(p,{placa:upper(o.placa),modelo:o.modelo||'',ano:o.ano===''?null:num(o.ano),status:o.status||'ativo'});
    if(key==='tacografos') Object.assign(p,{placa:upper(o.placa),data:date(o.data),validade:date(o.validade),status:o.status||'',obs:o.obs||''});
    if(key==='oleo') Object.assign(p,{placa:upper(o.placa),data:date(o.data),km:num(o.km),proxkm:num(o.proxKm??o.proxkm),obs:o.obs||''});
    if(key==='manutencoes') Object.assign(p,{data:date(o.data),placa:upper(o.placa),tipo:o.tipo||'',origem:o.origem||'',descricao:o.descricao||'',valor:num(o.valor),status:o.status||'',anexo:o.anexo||'',obs:o.obs||''});
    if(key==='producao') Object.assign(p,{mes:o.mes||(typeof ym==='function'?ym(o.data):''),data:date(o.data),placa:upper(o.placa),servico:o.servico||'',responsavel:o.responsavel||'',obs:o.obs||'',anexo:o.anexo||''});
    if(key==='pontos') Object.assign(p,{motorista:o.motorista||'',data:date(o.data),placa:upper(o.placa),auto:o.auto||'',gravidade:o.gravidade||'',pontos:num(o.pontos),aceitou:o.aceitou||'Pendente',multa_id:o.multaId||o.multa_id||o.origem_multa_id||null});
    Object.keys(p).forEach(k=>{ if(p[k]===undefined) delete p[k]; });
    return p;
  }
  function variants(key,o){
    const p=payload(key,o), v=[p];
    if(key==='oleo'){
      const a={...p,proxKm:p.proxkm}; delete a.proxkm; v.push(a);
      const b={...p,prox_km:p.proxkm}; delete b.proxkm; v.push(b);
    }
    if(key==='motoristas') { const a={...p,cnhArquivo:p.cnharquivo}; delete a.cnharquivo; v.push(a); }
    if(key==='manutencoes') { const a={...p}; delete a.anexo; delete a.obs; v.push(a); }
    if(key==='producao') { const a={...p}; delete a.anexo; v.push(a); }
    return v;
  }
  async function saveRemote(key,obj){
    if(key==='multas') return true;
    const c=db(), t=await tableFor(key); if(!c||!t) return false;
    let last=null;
    for(const p of variants(key,obj)){
      try{
        const {data:row,error}=await c.from(t).upsert(p,{onConflict:'id'}).select().single();
        if(error) throw error;
        if(row) Object.assign(obj,rowToApp(key,row));
        return true;
      }catch(e){ last=e; }
    }
    throw last;
  }
  async function delRemote(key,itemId){
    if(key==='multas') return true;
    const c=db(), t=await tableFor(key); if(!c||!t) return false;
    const {error}=await c.from(t).delete().eq('id',Number(itemId));
    if(error) throw error;
    return true;
  }
  async function loadRemote(key){
    const c=db(), t=await tableFor(key); if(!c||!t) return false;
    try{
      const order=key==='producao'?'data':'id';
      const {data:rows,error}=await c.from(t).select('*').order(order,{ascending:key!=='producao'});
      if(error) throw error;
      if(Array.isArray(rows) && rows.length){
        const local=arr(key).slice();
        for(const item of rows.map(r=>rowToApp(key,r))){
          const i=local.findIndex(x=>String(x.id)===String(item.id));
          if(i>=0) local[i]={...local[i],...item}; else local.push(item);
        }
        data[key]=local;
      }
      return true;
    }catch(e){ console.warn('Falha ao carregar '+key,e); return false; }
  }
  async function saveMonth(key,mes){
    if(!mes) return;
    const tableKey=key==='producao'?'producaoMeses':'manutencoesMeses';
    const c=db(), t=await tableFor(tableKey); if(!c||!t) return;
    try{ await c.from(t).upsert({mes},{onConflict:'mes'}); }catch(e){ console.warn('Falha ao salvar pasta',e); }
  }
  async function loadMonths(key){
    const tableKey=key==='producao'?'producaoMeses':'manutencoesMeses';
    const target=key==='producao'?'producaoMeses':'manutencoesMeses';
    const c=db(), t=await tableFor(tableKey); if(!c||!t) return;
    try{ const {data:rows,error}=await c.from(t).select('*').order('mes',{ascending:true}); if(error) throw error; if(Array.isArray(rows)&&rows.length) data[target]=rows.map(r=>({mes:r.mes})); }catch(e){}
  }

  window.saveModal=async function(){
    const ctx = modalCtx ? {...modalCtx} : null;
    const before = ctx && data[ctx.key] ? new Set(data[ctx.key].map(x=>String(x.id))) : new Set();
    await oldSaveModal.apply(this,arguments);
    if(!ctx || ctx.key==='multas' || !SYNC_KEYS.includes(ctx.key)) return;
    const list=arr(ctx.key);
    const obj=ctx.itemId ? list.find(x=>String(x.id)===String(ctx.itemId)) : (list.find(x=>!before.has(String(x.id))) || list[list.length-1]);
    if(!obj) return;
    try{
      await saveRemote(ctx.key,obj);
      if(ctx.key==='producao' && obj.mes) await saveMonth('producao',obj.mes);
      if(ctx.key==='manutencoes' && typeof ym==='function' && ym(obj.data)) await saveMonth('manutencoes',ym(obj.data));
      say('Salvo no Supabase.');
    }catch(e){ console.error(e); alert('Salvou na tela, mas não salvou no Supabase. Detalhe: '+(e.message||e)); }
  };
  try{ saveModal=window.saveModal; }catch(e){}

  window.removeItem=async function(key,itemId){
    if(key==='multas') return oldRemoveItem.apply(this,arguments);
    if(!confirm('Excluir este registro?')) return;
    try{ await delRemote(key,itemId); }catch(e){ alert('Não consegui excluir no Supabase. Detalhe: '+(e.message||e)); return; }
    if(data[key]) data[key]=data[key].filter(x=>String(x.id)!==String(itemId));
    say('Excluído do Supabase.');
    if(typeof showPage==='function') showPage(currentPage);
  };
  try{ removeItem=window.removeItem; }catch(e){}

  window.syncTodasAbasSupabase=async function(){
    for(const key of SYNC_KEYS) await loadRemote(key);
    await loadMonths('producao'); await loadMonths('manutencoes');
    if(typeof renderNav==='function') renderNav();
    if(typeof showPage==='function') showPage(currentPage||'dashboard');
  };
  setTimeout(window.syncTodasAbasSupabase,1000);
  window.addEventListener('focus',()=>{ if(!document.hidden && SYNC_KEYS.includes(currentPage||'')) loadRemote(currentPage).then(()=>showPage(currentPage)); });

  /* Veículos separados por status, sem mexer no resto do sistema */
  window.selectedVehicleStatus=window.selectedVehicleStatus||'todos';
  function st(s){ const v=norm(s); if(v.includes('manut')) return 'manutencao'; if(v.includes('inat')) return 'inativo'; return 'ativo'; }
  function stTag(s){ const x=st(s); if(x==='manutencao') return '<span class="tag amber">Em manutenção</span>'; if(x==='inativo') return '<span class="tag gray">Inativo</span>'; return '<span class="tag green">Ativo</span>'; }
  function vTable(title,rows,empty){return `<div class="table-card"><div class="table-head"><h3>${title}</h3><small>${rows.length} veículo(s)</small></div>${rows.length?`<div class="table-scroll"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Linha</th><th>Ano</th><th>Motorista</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(v=>`<tr><td><span class="plate">${esc(v.placa)}</span></td><td>${esc(v.modelo||'-')}</td><td>${esc(v.linha||'-')}</td><td>${esc(v.ano||'-')}</td><td>${esc(v.motorista||'-')}</td><td>${stTag(v.status)}</td><td><div class="row-actions"><button class="icon-btn" onclick="openForm('veiculos',${v.id})">✎</button><button class="icon-btn" onclick="removeItem('veiculos',${v.id})">×</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`}</div>`;}
  window.setVehicleStatusFilter=function(s){ window.selectedVehicleStatus=s||'todos'; renderVeiculosList(); };
  window.renderVeiculosList=function(){
    const input=document.getElementById('veiSearch'); const q=typeof clean==='function'?clean(input?input.value:''):norm(input?input.value:'');
    const selected=window.selectedVehicleStatus||'todos'; const sel=document.getElementById('veiStatusSelect'); if(sel) sel.value=selected;
    let rows=(data.veiculos||[]).filter(r=>!q||(typeof clean==='function'?clean(Object.values(r).join(' ')):norm(Object.values(r).join(' '))).includes(q));
    if(selected!=='todos') rows=rows.filter(r=>st(r.status)===selected);
    const ativos=rows.filter(r=>st(r.status)==='ativo'), manut=rows.filter(r=>st(r.status)==='manutencao'), inativos=rows.filter(r=>st(r.status)==='inativo');
    const html=selected==='todos'?`<div class="vehicle-split-grid">${vTable('Veículos ativos',ativos,'Nenhum veículo ativo encontrado.')}${vTable('Veículos em manutenção',manut,'Nenhum veículo em manutenção encontrado.')}${inativos.length?vTable('Veículos inativos',inativos,''):''}</div>`:selected==='ativo'?vTable('Veículos ativos',ativos,'Nenhum veículo ativo encontrado.'):selected==='manutencao'?vTable('Veículos em manutenção',manut,'Nenhum veículo em manutenção encontrado.'):vTable('Veículos inativos',inativos,'Nenhum veículo inativo encontrado.');
    const target=document.getElementById('veiculosTable'); if(target) target.innerHTML=html;
  };
  window.renderVeiculos=function(){
    const rows=data.veiculos||[], ativos=rows.filter(r=>st(r.status)==='ativo').length, manut=rows.filter(r=>st(r.status)==='manutencao').length, inativos=rows.filter(r=>st(r.status)==='inativo').length;
    document.getElementById('veiculos').innerHTML=`<div class="stats"><div class="stat"><span>Ativos</span><strong>${ativos}</strong><em>em operação</em></div><div class="stat"><span>Em manutenção</span><strong>${manut}</strong><em>parados/oficina</em></div><div class="stat"><span>Inativos</span><strong>${inativos}</strong><em>fora de uso</em></div><div class="stat"><span>Total</span><strong>${rows.length}</strong><em>cadastrados</em></div></div><div class="filters"><div class="filter-row two"><input id="veiSearch" placeholder="Buscar por placa, modelo, linha ou motorista"><select id="veiStatusSelect"><option value="todos">Todos</option><option value="ativo">Ativos</option><option value="manutencao">Em manutenção</option><option value="inativo">Inativos</option></select></div></div><div id="veiculosTable"></div>`;
    document.getElementById('veiSearch').oninput=renderVeiculosList; document.getElementById('veiStatusSelect').onchange=e=>setVehicleStatusFilter(e.target.value); renderVeiculosList();
  };
})();
</script>

<script id="veiculos-sem-linha-motorista-final-js">
(function(){
  'use strict';
  function safeEsc(v){ try{return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c;});}catch(e){return String(v??'');} }
  function safeClean(v){ try{return typeof clean==='function'?clean(v):String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}catch(e){return String(v||'').toLowerCase();} }
  function normStatus(v){
    const s=safeClean(v||'ativo');
    if(s.includes('manut')) return 'manutencao';
    if(s.includes('inat')||s.includes('baix')||s.includes('parad')) return 'inativo';
    return 'ativo';
  }
  function tagStatus(v){
    const s=normStatus(v);
    if(s==='manutencao') return '<span class="tag amber">Em manutenção</span>';
    if(s==='inativo') return '<span class="tag red">Inativo</span>';
    return '<span class="tag green">Ativo</span>';
  }
  function sanitizeVehicles(){
    if(!window.data || !Array.isArray(data.veiculos)) return;

      delete v.motorista;
      delete v.linha;
      if(v.status) v.status=normStatus(v.status);

  }
  function vehicleTable(title, rows, emptyText){
    const body = rows.length ? rows.map(function(v){
      return '<tr>'+
        '<td><span class="plate">'+safeEsc(v.placa||'-')+'</span></td>'+
        '<td>'+safeEsc(v.modelo||'-')+'</td>'+
        '<td>'+safeEsc(v.ano||'-')+'</td>'+
        '<td>'+tagStatus(v.status)+'</td>'+
        '<td><div class="row-actions"><button class="icon-btn" title="Editar" onclick="openForm(\'veiculos\','+Number(v.id)+')">✎</button><button class="icon-btn" title="Excluir" onclick="removeItem(\'veiculos\','+Number(v.id)+')">×</button></div></td>'+
      '</tr>';
    }).join('') : '<tr><td colspan="5"><div class="empty">'+safeEsc(emptyText||'Nenhum veículo encontrado.')+'</div></td></tr>';
    return '<div class="table-card"><div class="table-head"><h3>'+title+'</h3><small>'+rows.length+' veículo(s)</small></div><div class="table-scroll"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Ano</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';

  window.renderVeiculosList=function(){

    });

    const ativos=rows.filter(function(r){return normStatus(r.status)==='ativo';});

        (inativos.length?vehicleTable('Veículos inativos',inativos,'Nenhum veículo inativo encontrado.'):'')+
      '</div>';

    else if(selected==='manutencao') html=vehicleTable('Veículos em manutenção',manut,'Nenhum veículo em manutenção encontrado.');
    else html=vehicleTable('Veículos inativos',inativos,'Nenhum veículo inativo encontrado.');
    const target=document.getElementById('veiculosTable'); if(target) target.innerHTML=html;
  };
  window.render_veiculos=function(){
    sanitizeVehicles();
    if(typeof schemas!=='undefined') schemas.veiculos=[['placa','Placa','text'],['modelo','Modelo','text'],['ano','Ano','number'],['status','Status','select:ativo,manutencao,inativo']];
    if(typeof setActions==='function') setActions('<button class="btn primary" onclick="openForm(\'veiculos\')">+ Novo veículo</button>');

    const el=document.getElementById('veiculos'); if(!el) return;

<!-- Correção estável: Tacógrafo, Óleo, Manutenções e Produção com Supabase sem zerar dados -->
<script id="sync-estavel-tac-oleo-man-producao">
(function(){
  'use strict';
  const MODS=['tacografos','oleo','manutencoes','producao'];
  const TABLES={
    tacografos:['tacografos','tacografo'],
    oleo:['oleo','troca_oleo','trocas_oleo','troca_de_oleo'],
    manutencoes:['manutencoes','manutencao'],
    producao:['producao','producao_dia','producao_do_dia'],
    producaoMeses:['producao_meses','pastas_producao'],
    manutencoesMeses:['manutencoes_meses','pastas_manutencoes']
  };
  const cache={};
  const backup={};
  function clone(x){ try{return JSON.parse(JSON.stringify(x||[]));}catch(e){return [];} }
  function keepBackup(){ MODS.forEach(k=>{ if(Array.isArray(data[k]) && data[k].length && !backup[k]) backup[k]=clone(data[k]); }); }
  keepBackup();
  function restoreIfZero(key){ if(Array.isArray(data[key]) && data[key].length===0 && backup[key] && backup[key].length){ data[key]=clone(backup[key]); return true; } return false; }
  const n=v=>Number(String(v??'').replace(',','.'))||0;
  const up=v=>String(v??'').trim().toUpperCase();
  const dt=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?String(v):null;
  const monthOf=v=>{ try{return typeof ym==='function'?ym(v):(/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?String(v).slice(0,7):'');}catch(e){return '';} };
  function db(){ try{return typeof connectSupabase==='function'?connectSupabase():null;}catch(e){return null;} }
  async function findTable(key){
    if(cache[key]) return cache[key];
    const c=db(); if(!c) return null;
    for(const t of (TABLES[key]||[key])){
      try{ const res=await c.from(t).select('*').limit(1); if(!res.error){ cache[key]=t; return t; } }catch(e){}
    }
    return null;
  }
  function missingColumn(err){
    const txt=String(err?.message||err?.details||err?.hint||err||'');
    const m=txt.match(/Could not find the '([^']+)' column|column "([^"]+)" does not exist|Could not find the ([a-zA-Z0-9_]+) column/i);
    return m ? (m[1]||m[2]||m[3]||'') : '';
  }
  function normalize(key,row){
    const o={...(row||{})};
    if(o.id!==undefined) o.id=Number(o.id);
    if(key==='tacografos'){
      o.placa=o.placa||o.veiculo||''; o.data=o.data||o.emissao||o.data_emissao||''; o.validade=o.validade||o.vencimento||''; o.obs=o.obs||o.observacao||''; o.status=o.status||o.situacao||'ativo';
    }
    if(key==='oleo'){
      o.placa=o.placa||o.veiculo||''; o.proxKm=n(o.proxKm??o.proxkm??o.prox_km??o.proximo_km); o.km=n(o.km); o.obs=o.obs||o.observacao||'';
    }
    if(key==='manutencoes'){
      o.placa=o.placa||o.veiculo||'';
      o.servico=o.servico||o.tipo||o.descricao||o.obs||o.observacao||o.peca||'';
      o.tipo=o.tipo||o.servico||o.peca||'';
      o.descricao=o.descricao||o.obs||o.observacao||o.servico||'';
      o.valor=n(o.valor); o.status=o.status||'concluido';
    }
    if(key==='producao'){
      o.placa=o.placa||o.veiculo||''; o.mes=o.mes||monthOf(o.data); o.obs=o.obs||o.observacao||'';
    }
    return o;
  }
  function payloadBase(key,o){
    o=o||{}; const idv=Number(o.id || (typeof id==='function'?id():Date.now()));
    if(key==='tacografos') return {id:idv,placa:up(o.placa),data:dt(o.data),validade:dt(o.validade),status:o.status||'ativo',obs:o.obs||''};
    if(key==='oleo') { const prox=n(o.proxKm??o.proxkm??o.prox_km); return {id:idv,placa:up(o.placa),modelo:o.modelo||'',data:dt(o.data),km:n(o.km),proxkm:prox,prox_km:prox,proxKm:prox,obs:o.obs||''}; }
    if(key==='manutencoes') {
      const servicoMan = String(o.servico || o.tipo || o.descricao || o.obs || '').trim() || 'Serviço de manutenção';
      const descMan = String(o.descricao || o.obs || o.servico || o.tipo || '').trim();
      return {id:idv,data:dt(o.data),placa:up(o.placa),servico:servicoMan,tipo:o.tipo||servicoMan,origem:o.origem||'',descricao:descMan,obs:descMan,valor:n(o.valor),status:o.status||'concluido'};
    }
    if(key==='producao') { const mes=o.mes||monthOf(o.data); return {id:idv,mes:mes,data:dt(o.data),placa:up(o.placa),servico:o.servico||'',responsavel:o.responsavel||'',obs:o.obs||''}; }
    return {id:idv,...o};
  }
  function payloadVariants(key,o){
    const p=payloadBase(key,o); const out=[p];
    if(key==='oleo'){
      let a={...p}; delete a.proxKm; delete a.prox_km; out.push(a);
      let b={...p}; delete b.proxKm; delete b.proxkm; out.push(b);
      let c={...p}; delete c.proxkm; delete c.prox_km; out.push(c);
    }
    if(key==='manutencoes'){
      let a={...p}; delete a.descricao; out.push(a);
      let b={...p}; delete b.obs; out.push(b);
      let c={...p}; delete c.descricao; delete c.obs; out.push(c);
    }
    if(key==='tacografos'){
      let a={...p}; delete a.obs; out.push(a);
    }
    if(key==='producao'){
      let a={...p}; delete a.obs; out.push(a);
      let b={...p}; delete b.mes; out.push(b);
    }
    return out;
  }
  async function upsertSmart(table,payloads){
    const c=db(); let last=null;
    for(const original of payloads){
      let p={...original};
      Object.keys(p).forEach(k=>{ if(p[k]===undefined) delete p[k]; });
      for(let i=0;i<20;i++){
        try{
          const r=await c.from(table).upsert(p,{onConflict:'id'}).select().single();
          if(!r.error) return r.data||p;
          throw r.error;
        }catch(e){
          last=e; const col=missingColumn(e);
          if(col && Object.prototype.hasOwnProperty.call(p,col)){ delete p[col]; continue; }
          try{ const r2=await c.from(table).upsert(p,{onConflict:'id'}); if(!r2.error) return p; last=r2.error; const col2=missingColumn(r2.error); if(col2 && Object.prototype.hasOwnProperty.call(p,col2)){ delete p[col2]; continue; } }catch(e2){ last=e2; const col3=missingColumn(e2); if(col3 && Object.prototype.hasOwnProperty.call(p,col3)){ delete p[col3]; continue; } }
          break;
        }
      }
    }
    throw last||new Error('Não consegui salvar no Supabase.');
  }
  async function salvarRegistroSupabase(key,obj){
    if(!MODS.includes(key)) return false;
    const t=await findTable(key); if(!t) throw new Error('Tabela não encontrada para '+key);
    const row=await upsertSmart(t,payloadVariants(key,obj));
    Object.assign(obj, normalize(key,row||obj));
    keepBackup();
    return true;
  }
  async function excluirRegistroSupabase(key,itemId){
    if(!MODS.includes(key)) return false;
    const t=await findTable(key), c=db(); if(!t||!c) return false;
    const r=await c.from(t).delete().eq('id',Number(itemId));
    if(r.error) throw r.error;
    return true;
  }
  async function excluirMesSupabase(key,mes){
    const t=await findTable(key), c=db(); if(!t||!c) return false;
    const start=mes+'-01';
    const y=Number(mes.slice(0,4)), m=Number(mes.slice(5,7));
    const end=(m===12?String(y+1)+'-01':String(y)+'-'+String(m+1).padStart(2,'0'))+'-01';
    async function tryDelete(builder){ try{ const r=await builder; if(r.error){ const col=missingColumn(r.error); if(!col) throw r.error; } }catch(e){ const col=missingColumn(e); if(!col) throw e; } }
    await tryDelete(c.from(t).delete().gte('data',start).lt('data',end));
    await tryDelete(c.from(t).delete().gte('validade',start).lt('validade',end));
    await tryDelete(c.from(t).delete().eq('mes',mes));
    const mt=await findTable(key==='producao'?'producaoMeses':'manutencoesMeses');
    if(mt) { try{ await c.from(mt).delete().eq('mes',mes); }catch(e){} }
    return true;
  }
  window.salvarRegistroSupabase=salvarRegistroSupabase;
  window.excluirRegistroSupabase=excluirRegistroSupabase;
  function applySchemas(){
    if(typeof schemas==='undefined') return;
    schemas.tacografos=[['placa','Placa','text'],['data','Data da emissão/aferição','date'],['validade','Validade','date'],['status','Status','select:ativo,pendente,vencido,inativo'],['obs','Observação','text']];
    schemas.oleo=[['placa','Placa','text'],['modelo','Modelo','text'],['data','Data','date'],['km','KM','number'],['proxKm','Próxima KM','number'],['obs','Observação','text']];
    schemas.manutencoes=[['data','Data','date'],['placa','Placa','text'],['tipo','Serviço','text'],['origem','Origem','text'],['descricao','Observação','text'],['valor','Valor','number'],['status','Status','select:concluido,pendente,em andamento']];
    schemas.producao=[['mes','Pasta/Mês AAAA-MM','text'],['data','Data','date'],['placa','Placa','text'],['servico','Serviço','text'],['responsavel','Responsável','text'],['obs','Observação','text']];
  }
  const oldOpen=window.openForm || (typeof openForm==='function'?openForm:null);
  window.openForm=function(key,itemId){ applySchemas(); return oldOpen.apply(this,arguments); };
  try{ openForm=window.openForm; }catch(e){}
  function readModalObj(key,itemId){
    const obj=itemId ? ((data[key]||[]).find(x=>String(x.id)===String(itemId)) || {id:Number(itemId)}) : {id:(typeof id==='function'?id():Date.now())};
    (schemas[key]||[]).forEach(([prop,,type])=>{ const el=document.getElementById('f_'+prop); if(!el) return; let v=el.value; if(type==='number') v=n(v); if(prop==='placa') v=up(v); obj[prop]=v; });
    if(key==='producao' && !obj.mes) obj.mes=monthOf(obj.data);
    return obj;
  }
  const oldSave=window.saveModal || (typeof saveModal==='function'?saveModal:null);
  window.saveModal=async function(){
    applySchemas();
    const ctx=(typeof modalCtx!=='undefined' && modalCtx)?{...modalCtx}:null;
    if(!ctx || !MODS.includes(ctx.key)) return oldSave.apply(this,arguments);
    const key=ctx.key; const obj=readModalObj(key,ctx.itemId);
    if(!ctx.itemId && !(data[key]||[]).some(x=>String(x.id)===String(obj.id))) data[key].push(obj);
    if(key==='producao' && obj.mes && !((data.producaoMeses||[]).some(x=>(typeof x==='string'?x:x.mes)===obj.mes))) data.producaoMeses=[...(data.producaoMeses||[]),{mes:obj.mes}];
    if(key==='manutencoes') { const mm=monthOf(obj.data); if(mm && !((data.manutencoesMeses||[]).some(x=>(typeof x==='string'?x:x.mes)===mm))) data.manutencoesMeses=[...(data.manutencoesMeses||[]),{mes:mm}]; }
    try{ await salvarRegistroSupabase(key,obj); if(typeof closeModal==='function') closeModal(); if(typeof toast==='function') toast('Salvo no Supabase.'); if(typeof showPage==='function') showPage(currentPage); }
    catch(e){ console.error(e); if(typeof closeModal==='function') closeModal(); if(typeof showPage==='function') showPage(currentPage); alert('Salvou na tela, mas não salvou no Supabase. Detalhe: '+(e.message||e)); }
  };
  try{ saveModal=window.saveModal; }catch(e){}
  const oldRemove=window.removeItem || (typeof removeItem==='function'?removeItem:null);
  window.removeItem=async function(key,itemId){
    if(!MODS.includes(key)) return oldRemove.apply(this,arguments);
    if(!confirm('Excluir este registro?')) return;
    try{ await excluirRegistroSupabase(key,itemId); }catch(e){ console.warn(e); }
    data[key]=(data[key]||[]).filter(x=>String(x.id)!==String(itemId));

    if(typeof toast==='function') toast('Registro excluído.');
    if(typeof showPage==='function') showPage(currentPage);

  try{ removeItem=window.removeItem; }catch(e){}

    const prop=key==='tacografos'?'validade':'data';
    data[key]=(data[key]||[]).filter(r=>monthOf(r[prop]||r.data)!==mes && String(r.mes||'')!==mes);
    if(key==='producao') data.producaoMeses=(data.producaoMeses||[]).filter(x=>(typeof x==='string'?x:x.mes)!==mes);
    if(key==='manutencoes') data.manutencoesMeses=(data.manutencoesMeses||[]).filter(x=>(typeof x==='string'?x:x.mes)!==mes);

  window.deleteProdMonth=function(mes){ return window.excluirPastaModulo('producao',mes); };

  window.deleteTacMonth=function(mes){ return window.excluirPastaModulo('tacografos',mes); };
  // Não deixa carregamento remoto vazio substituir os dados embutidos.
  const oldSync=window.syncTodasAbasSupabase;
  window.syncTodasAbasSupabase=async function(){
    keepBackup();
    try{ if(typeof oldSync==='function') await oldSync(); }catch(e){ console.warn(e); }

    if(restored && typeof showPage==='function') showPage(currentPage||'dashboard');
  };
  setTimeout(function(){ let restored=false; MODS.forEach(k=>{ if(restoreIfZero(k)) restored=true; }); if(restored && typeof showPage==='function') showPage(currentPage||'dashboard'); }, 1400);
  applySchemas();
})();
</script>



<!-- Correção definitiva Manutenções: coluna obrigatória servico no Supabase -->
<script id="fix-manutencoes-servico-obrigatorio">
(function(){
  'use strict';
  function texto(v){ return String(v ?? '').trim(); }
  function prepararManutencao(obj){
    if(!obj) return obj;
    const servico = texto(obj.servico || obj.tipo || obj.descricao || obj.obs) || 'Serviço de manutenção';
    obj.servico = servico;
    if(!texto(obj.tipo)) obj.tipo = servico;
    if(!texto(obj.descricao) && texto(obj.obs)) obj.descricao = obj.obs;
    return obj;
  }
  if(Array.isArray(window.data?.manutencoes)) window.data.manutencoes.forEach(prepararManutencao);
  const oldSaveModal = window.saveModal;
  window.saveModal = async function(){
    const ctx = (typeof modalCtx !== 'undefined' && modalCtx) ? {...modalCtx} : null;
    if(ctx && ctx.key === 'manutencoes'){
      const original = window.salvarRegistroSupabase;
      if(typeof original === 'function'){
        window.salvarRegistroSupabase = async function(key,obj){
          if(key === 'manutencoes') prepararManutencao(obj);
          return original.apply(this, arguments);
        };
      }
    }
    return oldSaveModal.apply(this, arguments);
  };
  try{ saveModal = window.saveModal; }catch(e){}
})();
</script>



<!-- Correção definitiva: Tacógrafo adiciona/remove e aparece na tela imediatamente -->
<script id="fix-definitivo-tacografo-aparece-e-sincroniza">
(function(){
  'use strict';
  function db(){ try{return typeof connectSupabase==='function'?connectSupabase():null;}catch(e){return null;} }
  function upper(v){ return String(v??'').trim().toUpperCase(); }
  function str(v){ return String(v??'').trim(); }
  function dt(v){ v=str(v); return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:''; }
  function makeId(){ try{return typeof id==='function'?id():Date.now()+Math.floor(Math.random()*999);}catch(e){return Date.now()+Math.floor(Math.random()*999);} }
  function month(v){ try{return typeof ym==='function'?ym(v):(/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?String(v).slice(0,7):'');}catch(e){return '';} }
  function fmt(v){ try{return typeof fmtDate==='function'?fmtDate(v):(v||'-');}catch(e){return v||'-';} }
  function escapeHtml(v){ try{return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}catch(e){return String(v??'');} }
  function cleanText(v){ try{return typeof clean==='function'?clean(v):String(v||'').toLowerCase();}catch(e){return String(v||'').toLowerCase();} }
  function statusHtml(v){ try{return typeof statusTag==='function'?statusTag(v):'<span class="tag gray">'+escapeHtml(v||'-')+'</span>';}catch(e){return '<span class="tag gray">'+escapeHtml(v||'-')+'</span>'; } }
  function tableHtml(title,heads,body){ try{return typeof table==='function'?table(title,heads,body):('<div class="table-card"><div class="table-head"><h3>'+title+'</h3><small>Controle</small></div><div class="table-scroll"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(body||'<tr><td colspan="99">Nenhum registro.</td></tr>')+'</tbody></table></div></div>');}catch(e){return '';}}
  function statsHtml(items){ try{return typeof stats==='function'?stats(items):'';}catch(e){return '';} }
  function folderHtml(key,months){ try{return typeof folderHtmlEmpresa==='function'?folderHtmlEmpresa(key,months):'';}catch(e){return '';}}
  function filterBox(){ try{return typeof filterHtml==='function'?filterHtml('tacSearch','Buscar placa, emissão, validade, situação ou observação...'):'<div class="filters"><div class="filter-row two"><input id="tacSearch" placeholder="Buscar placa, emissão, validade, situação ou observação..."></div></div>';}catch(e){return '<div class="filters"><input id="tacSearch" placeholder="Buscar placa..."></div>';}}
  function ensure(){ if(!window.data && typeof data!=='undefined') window.data=data; if(!data.tacografos) data.tacografos=[]; return data.tacografos; }
  function normalize(row){ row=row||{}; return {
    id:Number(row.id||makeId()),
    placa:upper(row.placa||row.veiculo||row.carro||''),
    data:dt(row.data||row.emissao||row.data_emissao||row.data_afericao||row.aferido_em||row.created_at||''),
    validade:dt(row.validade||row.vencimento||row.data_validade||row.validade_tacografo||''),
    status:str(row.status||row.situacao||row.resultado||'ativo'),
    obs:str(row.obs||row.observacao||row.observacoes||'')
  }; }
  function selectedMonth(){ return (typeof folderSel!=='undefined' && folderSel && folderSel.tacografos) ? folderSel.tacografos : (typeof selectedTacMonth!=='undefined' ? selectedTacMonth : ''); }
  function setSelectedMonth(m){ if(typeof folderSel!=='undefined' && folderSel) folderSel.tacografos=m||''; try{ selectedTacMonth=m||''; }catch(e){} }
  function months(){ const set=new Set(); ensure().forEach(r=>{ const m=month(r.validade||r.data); if(m) set.add(m); }); return Array.from(set).sort(); }
  function upsertLocal(obj){ const list=ensure(); obj=normalize(obj); const i=list.findIndex(x=>String(x.id)===String(obj.id)); if(i>=0) list[i]={...list[i],...obj}; else list.push(obj); return obj; }
  function removeLocal(itemId){ data.tacografos=ensure().filter(x=>String(x.id)!==String(itemId)); }
  async function tableName(){ const c=db(); if(!c) return null; for(const t of ['tacografos','tacografo']){ try{ const r=await c.from(t).select('*').limit(1); if(!r.error) return t; }catch(e){} } return null; }
  function missingCol(err){ const txt=String(err?.message||err?.details||err||''); const m=txt.match(/Could not find the '([^']+)' column|column "([^"]+)" does not exist/i); return m?(m[1]||m[2]):''; }
  async function saveSupabase(obj){
    const c=db(), t=await tableName(); if(!c||!t) return null;
    obj=normalize(obj);
    const base={id:Number(obj.id),placa:obj.placa,data:obj.data||null,validade:obj.validade||null,status:obj.status||'ativo',obs:obj.obs||''};
    const tries=[base,{...base,observacao:base.obs},{id:base.id,placa:base.placa,data:base.data,validade:base.validade,status:base.status},{id:base.id,placa:base.placa,validade:base.validade,status:base.status},{id:base.id,placa:base.placa,data:base.data,validade:base.validade}];
    let last=null;
    for(const original of tries){
      let p={...original};
      for(let i=0;i<10;i++){
        try{
          const r=await c.from(t).upsert(p,{onConflict:'id'}).select().single();
          if(!r.error) return normalize(r.data||p);
          throw r.error;
        }catch(e){ last=e; const col=missingCol(e); if(col && Object.prototype.hasOwnProperty.call(p,col)){ delete p[col]; continue; } break; }
      }
    }
    throw last||new Error('Não foi possível salvar tacógrafo.');
  }
  async function loadSupabase(){
    const c=db(), t=await tableName(); if(!c||!t) return false;
    try{
      const r=await c.from(t).select('*'); if(r.error) throw r.error;
      (r.data||[]).map(normalize).filter(x=>x.placa||x.data||x.validade).forEach(upsertLocal);

<!-- Correção: pastas do Tacógrafo criadas pelo mês da Validade/Vencimento -->
<script id="fix-tacografo-pastas-validade-vencimento">
(function(){
  'use strict';
  function S(v){ return String(v==null?'':v).trim(); }

  function F(v){ try{return typeof fmtDate==='function'?fmtDate(v):(v||'-');}catch(e){return v||'-';} }

  window.renderTacListEmpresa=window.renderTacListFinal=function(){

    target.innerHTML=TB(sel?'Tacógrafos — '+MN(sel):'Tacógrafos — Todos os meses',['Placa','Emissão','Validade/Vencimento','Situação','Obs','Ações'],rows.map(function(r){
      const val=S(r.validade||r.vencimento||r.data_validade||r.validade_tacografo||'');

    }).join(''));
  };
  window.render_tacografos=function(){
    if(typeof setActions==='function') setActions('<button class="btn primary" onclick="openForm(\'tacografos\')">+ Novo tacógrafo</button>');
    const ms=months(), sel=getSel(); const el=document.getElementById('tacografos'); if(!el) return;
    el.innerHTML=ST([['Registros',arr().length,'tacógrafos'],['Ativos',arr().filter(x=>C(x.status||x.situacao).includes('ativo')||C(x.status||x.situacao).includes('ok')).length,'válidos'],['Pastas',ms.length,'por validade/vencimento'],['Selecionado',sel?MN(sel):'Todos','pasta atual']])+foldersHtml(ms)+FB()+'<div id="tacInfo"></div>';

  // Depois de salvar tacógrafo, sempre recalcula as pastas pelo vencimento/validade e mostra a pasta correta.
  const oldSave=window.saveModal || (typeof saveModal==='function'?saveModal:null);
  window.saveModal=async function(){
    const ctx=(typeof modalCtx!=='undefined' && modalCtx)?modalCtx:null;
    const isTac=ctx && ctx.key==='tacografos';
    if(!isTac) return oldSave?oldSave.apply(this,arguments):undefined;
    const beforeIds=new Set(arr().map(x=>String(x.id)));

    const newest=arr().slice().reverse().find(x=>!beforeIds.has(String(x.id))) || arr().slice().sort((a,b)=>Number(b.id||0)-Number(a.id||0))[0];
    const m=newest?tacMonth(newest):'';
    if(m) setSel(m); else setSel('');

<!-- Correção definitiva Tacógrafo: pasta fixa por Validade/Vencimento e salvamento sem perder mês -->
<script id="fix-tacografo-pasta-nao-sumir-definitivo">
(function(){
  'use strict';
  const LS_KEY='gf_tacografos_cache_vencimento_v2';
  function str(v){return String(v==null?'':v).trim();}
  function upper(v){return str(v).toUpperCase();}
  function esc2(v){try{return typeof esc==='function'?esc(v):str(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));}catch(e){return str(v);}}

  function fmt(v){try{return typeof fmtDate==='function'?fmtDate(v):(str(v)||'-');}catch(e){return str(v)||'-';}}
  function ym2(v){v=str(v);return /^\d{4}-\d{2}-\d{2}$/.test(v)?v.slice(0,7):(/^\d{4}-\d{2}$/.test(v)?v:'');}
  function mn(v){try{return typeof monthName==='function'?monthName(v):v;}catch(e){return v;}}

  function pickVal(r){return str(r.validade||r.vencimento||r.data_validade||r.validade_tacografo||r.data_vencimento||'');}
  function pickData(r){return str(r.data||r.emissao||r.data_emissao||r.data_afericao||r.afericao||r.aferido_em||'');}
  function norm(r, fallback){r=r||{}; fallback=fallback||{}; const idv=Number(r.id||fallback.id||Date.now()+Math.floor(Math.random()*999)); return {
    id:idv,

    data:pickData(r)||fallback.data||'',

    vencimento:pickVal(r)||fallback.validade||'',
    status:str(r.status||r.situacao||r.resultado||fallback.status||'ativo'),

  };}
  function saveCache(){try{localStorage.setItem(LS_KEY,JSON.stringify(list().map(norm)));}catch(e){}}

  function upsertLocal(obj){const arr=list(); const old=arr.find(x=>String(x.id)===String(obj.id)); const n=norm(obj,old); const i=arr.findIndex(x=>String(x.id)===String(n.id)); if(i>=0) arr[i]={...arr[i],...n}; else arr.push(n); saveCache(); return n;}
  function removeLocal(id){data.tacografos=list().filter(x=>String(x.id)!==String(id)); saveCache();}
  function mTac(r){return ym2(pickVal(r)||r.validade||r.vencimento||r.data_validade||r.data_vencimento||'');}
  function getSel(){try{if(typeof folderSel!=='undefined'&&folderSel) return folderSel.tacografos||'';}catch(e){} try{return selectedTacMonth||'';}catch(e){return '';}}
  function setSel(m){try{if(typeof folderSel!=='undefined'&&folderSel) folderSel.tacografos=m||'';}catch(e){} try{selectedTacMonth=m||'';}catch(e){} }
  function months(){return Array.from(new Set(list().map(mTac).filter(Boolean))).sort();}
  function tableCard(title,heads,rows){try{if(typeof table==='function') return table(title,heads,rows);}catch(e){} return '<div class="table-card"><div class="table-head"><h3>'+esc2(title)+'</h3></div><div class="table-scroll"><table><thead><tr>'+heads.map(h=>'<th>'+esc2(h)+'</th>').join('')+'</tr></thead><tbody>'+(rows||'<tr><td colspan="99">Nenhum registro.</td></tr>')+'</tbody></table></div></div>';}
  function stats2(items){try{return typeof stats==='function'?stats(items):'';}catch(e){return '';}}
  function filter2(){try{return typeof filterHtml==='function'?filterHtml('tacSearch','Buscar placa, emissão, validade, vencimento, status ou observação...'):'<div class="filters"><input id="tacSearch" placeholder="Buscar..."></div>';}catch(e){return '<div class="filters"><input id="tacSearch" placeholder="Buscar..."></div>';}}
  function folders(){const sel=getSel(); const all=[['','Todos os meses']].concat(months().map(m=>[m,mn(m)])); return '<div class="folders">'+all.map(([m,label])=>{const rows=list().filter(r=>!m||mTac(r)===m); return '<button type="button" class="folder '+(sel===m?'active':'')+'" onclick="selectTacFolderDef(\''+m+'\')"><div class="folder-icon">📁</div><strong>'+esc2(label)+' <span class="folder-count">'+rows.length+'</span></strong><small>Baseado na validade/vencimento</small></button>';}).join('')+'</div>';}
  async function tableName(){const c=db(); if(!c) return null; for(const t of ['tacografos','tacografo']){try{const r=await c.from(t).select('*').limit(1); if(!r.error) return t;}catch(e){}} return null;}
  function missingCol(err){const txt=str(err&& (err.message||err.details||err.hint) || err); const m=txt.match(/Could not find the '([^']+)' column|column "([^"]+)" does not exist/i); return m?(m[1]||m[2]):'';}
  async function saveRemote(obj){const c=db(), t=await tableName(); if(!c||!t) return null; const n=norm(obj); let payload={id:Number(n.id),placa:n.placa,data:n.data||null,validade:n.validade||null,vencimento:n.validade||null,data_validade:n.validade||null,status:n.status||'ativo',obs:n.obs||'',observacao:n.obs||''}; let last=null; for(let i=0;i<12;i++){try{const r=await c.from(t).upsert(payload,{onConflict:'id'}).select().single(); if(!r.error) return norm(r.data,n); throw r.error;}catch(e){last=e; const col=missingCol(e); if(col && Object.prototype.hasOwnProperty.call(payload,col)){delete payload[col]; continue;} throw e;}} throw last||new Error('Não salvou no Supabase');}
  async function loadRemote(){const c=db(), t=await tableName(); if(!c||!t) return false; try{const r=await c.from(t).select('*'); if(r.error) throw r.error; const existing={}; list().forEach(x=>existing[String(x.id)]=norm(x)); (r.data||[]).forEach(row=>{const fb=existing[String(row.id)]||{}; const n=norm(row,fb); if(n.placa||n.data||n.validade) upsertLocal(n);}); data.tacografos=list().map(norm).sort((a,b)=>String(a.validade||'').localeCompare(String(b.validade||''))||String(a.placa).localeCompare(String(b.placa))); saveCache(); return true;}catch(e){console.warn('Tacógrafo: não carregou do Supabase',e); return false;}}
  async function deleteRemote(id){const c=db(), t=await tableName(); if(!c||!t) return false; const r=await c.from(t).delete().eq('id',Number(id)); if(r.error) throw r.error; return true;}

  window.render_tacografos=function(){loadCache(); if(typeof setActions==='function') setActions('<button class="btn primary" onclick="openForm(\'tacografos\')">+ Novo tacógrafo</button>'); const sel=getSel(); const el=document.getElementById('tacografos'); if(!el) return; el.innerHTML=stats2([['Registros',list().length,'tacógrafos'],['Ativos',list().filter(x=>clean2(x.status).includes('ativo')||clean2(x.status).includes('ok')).length,'válidos'],['Pastas',months().length,'por validade/vencimento'],['Selecionado',sel?mn(sel):'Todos','pasta atual']])+folders()+filter2()+'<div id="tacInfo"></div>'; const inp=document.getElementById('tacSearch'); if(inp) inp.oninput=window.renderTacListEmpresa; window.renderTacListEmpresa();};

<!-- PATCH LUIZ: correção conservadora para óleo, tacógrafo e produção sem substituir listas -->
<script id="patch-luiz-nao-sumir-listas-v2">
(function(){
  'use strict';
  const KEYS=['oleo','producao','tacografos'];
  const TABLES={
    oleo:['oleo','troca_oleo','trocas_oleo','troca_de_oleo'],
    producao:['producao','producao_dia','producao_do_dia'],
    tacografos:['tacografos','tacografo']
  };
  const tableCache={};
  const remoteIds={oleo:new Set(),producao:new Set(),tacografos:new Set()};
  const deletedIds={oleo:new Set(),producao:new Set(),tacografos:new Set()};
  const originalSave=window.saveModal || (typeof saveModal==='function'?saveModal:null);
  const originalRemove=window.removeItem || (typeof removeItem==='function'?removeItem:null);
  const originalOpenAddMonth=window.openAddMonth || (typeof openAddMonth==='function'?openAddMonth:null);

  function db(){ try{return typeof connectSupabase==='function'?connectSupabase():null;}catch(e){return null;} }
  function msg(t){ try{ if(typeof toast==='function') toast(t); }catch(e){} }
  function up(s){ return String(s||'').trim().toUpperCase(); }
  function cleanStr(s){ return String(s??'').trim(); }
  function n(v){ const x=Number(String(v??'').replace(',','.')); return Number.isFinite(x)?x:0; }
  function validDate(v){ v=cleanStr(v); return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:null; }
  function month(v){ try{return typeof ym==='function'?ym(v):(/^\d{4}-\d{2}/.test(String(v||''))?String(v).slice(0,7):'');}catch(e){return '';} }
  function cacheKey(k){ return 'GF_FIX_MERGE_'+k; }
  function getData(k){ if(!window.data && typeof data!=='undefined') window.data=data; if(!data[k]) data[k]=[]; return data[k]; }
  function setData(k,arr){ if(!window.data && typeof data!=='undefined') window.data=data; data[k]=arr; }
  function saveCache(k){ try{ localStorage.setItem(cacheKey(k), JSON.stringify(getData(k)||[])); }catch(e){} }
  function loadCache(k){ try{ const arr=JSON.parse(localStorage.getItem(cacheKey(k))||'[]'); if(Array.isArray(arr)&&arr.length) arr.forEach(x=>mergeLocal(k,normalize(k,x),false)); }catch(e){} }
  function refresh(){ try{ if(typeof renderNav==='function') renderNav(); }catch(e){} try{ if(typeof showPage==='function') showPage(currentPage||'dashboard'); }catch(e){} }

  async function tableFor(k){
    if(tableCache[k]) return tableCache[k];
    const c=db(); if(!c) return null;
    for(const t of (TABLES[k]||[k])){
      try{ const r=await c.from(t).select('*').limit(1); if(!r.error){ tableCache[k]=t; return t; } }catch(e){}
    }
    return null;
  }
  function normalize(k,row){
    const r=Object.assign({},row||{});
    if(r.id!==undefined) r.id=Number(r.id);
    delete r.created_at; delete r.updated_at;
    if(k==='oleo'){
      r.placa=up(r.placa||r.veiculo||r.carro||'');
      r.data=cleanStr(r.data||'');
      r.km=n(r.km);
      r.proxKm=n(r.proxKm??r.proxkm??r.prox_km??r.proximo_km);
      r.obs=cleanStr(r.obs||r.observacao||'');
    }
    if(k==='producao'){
      r.placa=up(r.placa||r.veiculo||r.carro||'');
      r.data=cleanStr(r.data||'');
      r.mes=cleanStr(r.mes||month(r.data));
      r.servico=cleanStr(r.servico||r.descricao||'');
      r.responsavel=cleanStr(r.responsavel||'');
      r.obs=cleanStr(r.obs||r.observacao||'');
    }
    if(k==='tacografos'){
      r.placa=up(r.placa||r.veiculo||r.carro||'');
      r.data=cleanStr(r.data||r.emissao||r.data_emissao||r.data_afericao||'');
      r.validade=cleanStr(r.validade||r.vencimento||r.data_validade||r.data_vencimento||'');
      r.status=cleanStr(r.status||r.situacao||'ativo');
      r.obs=cleanStr(r.obs||r.observacao||r.observacoes||'');
    }
    if(!r.id) r.id=Date.now()+Math.floor(Math.random()*9999);
    return r;
  }
  function mergeLocal(k,obj,writeCache=true){
    const arr=getData(k);
    const id=String(obj.id);
    if(deletedIds[k] && deletedIds[k].has(id)) return null;
    const i=arr.findIndex(x=>String(x.id)===id);
    if(i>=0) arr[i]=Object.assign({},arr[i],obj); else arr.push(obj);
    if(k==='producao') ensureProdMonth(obj.mes||month(obj.data));
    if(writeCache) saveCache(k);
    return obj;
  }
  function removeLocal(k,itemId){
    const id=String(itemId);
    deletedIds[k].add(id);
    setData(k,getData(k).filter(x=>String(x.id)!==id));
    saveCache(k);
  }
  function ensureProdMonth(m){
    if(!m) return;
    if(!data.producaoMeses) data.producaoMeses=[];
    if(!data.producaoMeses.some(x=>String((typeof x==='string'?x:x.mes)||'')===m)) data.producaoMeses.push({mes:m});
  }
  function payloads(k,obj){
    const r=normalize(k,obj);
    if(k==='oleo'){
      return [
        {id:r.id,placa:r.placa,data:validDate(r.data),km:n(r.km),proxkm:n(r.proxKm),obs:r.obs},
        {id:r.id,placa:r.placa,data:validDate(r.data),km:n(r.km),proxKm:n(r.proxKm),obs:r.obs},
        {id:r.id,placa:r.placa,data:validDate(r.data),km:n(r.km),prox_km:n(r.proxKm),obs:r.obs}
      ];
    }
    if(k==='producao'){
      return [
        {id:r.id,mes:r.mes||month(r.data),data:validDate(r.data),placa:r.placa,servico:r.servico,responsavel:r.responsavel,obs:r.obs,anexo:r.anexo||''},
        {id:r.id,mes:r.mes||month(r.data),data:validDate(r.data),placa:r.placa,servico:r.servico,responsavel:r.responsavel,obs:r.obs}
      ];
    }
    if(k==='tacografos'){
      return [
        {id:r.id,placa:r.placa,data:validDate(r.data),validade:validDate(r.validade),status:r.status||'ativo',obs:r.obs},
        {id:r.id,placa:r.placa,data:validDate(r.data),vencimento:validDate(r.validade),status:r.status||'ativo',obs:r.obs},
        {id:r.id,placa:r.placa,data:validDate(r.data),data_validade:validDate(r.validade),status:r.status||'ativo',obs:r.obs}
      ];
    }
    return [r];
  }
  function missingCol(e){ const s=String((e&&(e.message||e.details||e.hint))||e||''); const m=s.match(/Could not find the '([^']+)' column|column "([^"]+)" does not exist/i); return m&&(m[1]||m[2]); }
  async function saveRemote(k,obj){
    const c=db(), t=await tableFor(k); if(!c||!t) return false;
    let last=null;
    for(const original of payloads(k,obj)){
      let p=Object.assign({},original);
      for(let tries=0;tries<10;tries++){
        try{
          const r=await c.from(t).upsert(p,{onConflict:'id'}).select().single();
          if(r.error) throw r.error;
          const saved=normalize(k,Object.assign({},obj,r.data||{}));
          remoteIds[k].add(String(saved.id));
          mergeLocal(k,saved,true);
          return true;
        }catch(e){
          last=e;
          const col=missingCol(e);
          if(col && Object.prototype.hasOwnProperty.call(p,col)){ delete p[col]; continue; }
          break;
        }
      }
    }
    throw last||new Error('Não salvou no Supabase');
  }
  async function deleteRemote(k,itemId){
    const c=db(), t=await tableFor(k); if(!c||!t) return false;
    const r=await c.from(t).delete().eq('id',Number(itemId));
    if(r.error) throw r.error;
    return true;
  }
  async function loadRemoteMerge(k,removeMissing){
    const c=db(), t=await tableFor(k); if(!c||!t) return false;
    try{
      const r=await c.from(t).select('*');
      if(r.error) throw r.error;
      const rows=(r.data||[]).map(x=>normalize(k,x));
      const idsNow=new Set(rows.map(x=>String(x.id)));
      rows.forEach(x=>{ remoteIds[k].add(String(x.id)); mergeLocal(k,x,true); });
      // Só remove automaticamente tacógrafo que já sabemos que veio do Supabase antes.
      // Isso evita zerar listas antigas/locais de óleo e produção.
      if(removeMissing && k==='tacografos' && rows.length>=0){
        const known=Array.from(remoteIds[k]);
        const toRemove=known.filter(id=>!idsNow.has(id));
        if(toRemove.length){
          toRemove.forEach(id=>deletedIds[k].add(id));
          setData(k,getData(k).filter(x=>!toRemove.includes(String(x.id))));
          saveCache(k);
        }
      }
      return true;
    }catch(e){ console.warn('Falha ao mesclar '+k,e); return false; }
  }
  function objFromModal(k,ctx){
    const base=ctx&&ctx.itemId? (getData(k).find(x=>String(x.id)===String(ctx.itemId))||{}) : {id:(ctx&&ctx.tempId)||Date.now()+Math.floor(Math.random()*9999)};
    const obj=Object.assign({},base);
    const fields={
      oleo:['placa','data','km','proxKm','obs'],
      producao:['mes','data','placa','servico','responsavel','obs'],
      tacografos:['placa','data','validade','status','obs']
    }[k]||[];
    fields.forEach(prop=>{
      const el=document.getElementById('f_'+prop);
      if(!el) return;
      let v=el.value;
      if(prop==='placa') v=up(v);
      if(prop==='km'||prop==='proxKm') v=n(v);
      obj[prop]=v;
    });
    if(k==='producao' && !obj.mes) obj.mes=month(obj.data);
    return normalize(k,obj);
  }
  window.saveModal=async function(){
    const ctx=(typeof modalCtx!=='undefined'&&modalCtx)?Object.assign({},modalCtx):null;
    if(!ctx || !KEYS.includes(ctx.key)) return originalSave?originalSave.apply(this,arguments):undefined;
    const k=ctx.key;
    const obj=objFromModal(k,ctx);
    if((k==='oleo'||k==='producao'||k==='tacografos') && !obj.placa){ alert('Informe a placa.'); return; }
    if(k==='producao' && !obj.mes){ alert('Informe a pasta/mês no formato AAAA-MM.'); return; }
    mergeLocal(k,obj,true);
    if(k==='producao') ensureProdMonth(obj.mes);
    try{ if(typeof closeModal==='function') closeModal(); }catch(e){}
    refresh();
    try{
      await saveRemote(k,obj);
      if(k==='producao') ensureProdMonth(obj.mes);
      refresh();
      msg('Salvo sem apagar os outros registros.');
    }catch(e){
      console.error(e);
      refresh();
      alert('Apareceu na tela, mas não salvou no Supabase. Detalhe: '+(e.message||e));
    }
  };
  try{ saveModal=window.saveModal; }catch(e){}

  window.removeItem=async function(key,itemId){
    if(!KEYS.includes(key)) return originalRemove?originalRemove.apply(this,arguments):undefined;
    if(!confirm('Excluir este registro?')) return;
    removeLocal(key,itemId);
    refresh();
    try{
      await deleteRemote(key,itemId);
      msg('Excluído e sincronizado.');
    }catch(e){
      console.error(e);
      alert('Excluiu desta tela, mas não consegui excluir no Supabase. Detalhe: '+(e.message||e));
    }
  };
  try{ removeItem=window.removeItem; }catch(e){}

  window.openAddMonth=function(){
    const atual=(typeof folderSel!=='undefined'&&folderSel&&folderSel.producao)||month(new Date().toISOString().slice(0,10))||'2026-06';
    const m=prompt('Digite a pasta no formato AAAA-MM:', atual);
    if(m===null) return;
    if(!/^\d{4}-\d{2}$/.test(m)){ alert('Use o formato AAAA-MM.'); return; }
    ensureProdMonth(m);
    try{ if(typeof folderSel!=='undefined'&&folderSel) folderSel.producao=m; }catch(e){}
    try{ selectedProdMonth=m; }catch(e){}
    saveCache('producao');
    refresh();
    msg('Pasta criada sem apagar as outras.');
  };
  try{ openAddMonth=window.openAddMonth; }catch(e){}

  async function startRealtime(){
    const c=db(); if(!c || typeof c.channel!=='function') return;
    for(const k of KEYS){
      const t=await tableFor(k); if(!t) continue;
      try{
        c.channel('luiz-final-'+t+'-'+Math.random().toString(36).slice(2))
          .on('postgres_changes',{event:'*',schema:'public',table:t},async payload=>{
            if(payload.eventType==='DELETE'){
              const rid=payload.old&&payload.old.id;
              if(rid!==undefined){ deletedIds[k].add(String(rid)); setData(k,getData(k).filter(x=>String(x.id)!==String(rid))); saveCache(k); refresh(); return; }
            }
            await loadRemoteMerge(k,false); refresh();
          }).subscribe();
      }catch(e){ console.warn('Realtime '+k+' não iniciou',e); }
    }
  }
  window.syncCorrecoesLuiz=function(){ return Promise.all(KEYS.map(k=>loadRemoteMerge(k,k==='tacografos'))).then(refresh); };
  KEYS.forEach(loadCache);
  setTimeout(()=>{ window.syncCorrecoesLuiz(); startRealtime(); },1200);
  window.addEventListener('focus',()=>window.syncCorrecoesLuiz());
  console.log('Patch Luiz final: óleo/produção não substituem lista; tacógrafo exclui em tempo real.');
})();
</script>


<!-- Correção Manutenções: gravar tipo/peça, origem e descrição dentro da coluna descrição -->
<script id="fix-manutencoes-descricao-completa">
(function(){
  'use strict';
  function txt(v){ return String(v ?? '').trim(); }
  function parseDescCompleta(v){
    const s=txt(v);
    const out={tipo:'',origem:'',descricao:s};
    if(!s) return out;
    const tipo=s.match(/(?:^|\n)\s*(?:Tipo\/peça|Tipo|Serviço)\s*:\s*([^\n]+)/i);
    const origem=s.match(/(?:^|\n)\s*Origem\s*:\s*([^\n]+)/i);
    const desc=s.match(/(?:^|\n)\s*Descrição\s*:\s*([\s\S]*)$/i);
    if(tipo) out.tipo=txt(tipo[1]);
    if(origem) out.origem=txt(origem[1]);
    if(desc) out.descricao=txt(desc[1]);
    return out;
  }
  function montarDescricaoCompleta(tipo,origem,descricao){
    const linhas=[];
    tipo=txt(tipo); origem=txt(origem); descricao=txt(descricao);
    const parsed=parseDescCompleta(descricao);
    if(!tipo && parsed.tipo) tipo=parsed.tipo;
    if(!origem && parsed.origem) origem=parsed.origem;
    descricao=parsed.descricao || descricao;
    if(tipo) linhas.push('Tipo/peça: '+tipo);
    if(origem) linhas.push('Origem: '+origem);
    if(descricao) linhas.push('Descrição: '+descricao);
    return linhas.join('\n');
  }

  const oldOpenForm = window.openForm;
  window.openForm=function(key,itemId){
    const r = oldOpenForm ? oldOpenForm.apply(this,arguments) : undefined;
    if(key==='manutencoes'){
      setTimeout(function(){
        const tipoEl=document.getElementById('f_tipo');
        const origemEl=document.getElementById('f_origem');
        const descEl=document.getElementById('f_descricao');
        if(!descEl) return;
        const parsed=parseDescCompleta(descEl.value);
        if(tipoEl && !txt(tipoEl.value) && parsed.tipo) tipoEl.value=parsed.tipo;
        if(origemEl && !txt(origemEl.value) && parsed.origem) origemEl.value=parsed.origem;
        if(parsed.tipo || parsed.origem) descEl.value=parsed.descricao;
      },0);
    }
    return r;
  };
  try{ openForm=window.openForm; }catch(e){}

  const oldSaveModal = window.saveModal;
  window.saveModal=async function(){
    const ctx=(typeof modalCtx!=='undefined' && modalCtx) ? Object.assign({},modalCtx) : null;
    if(ctx && ctx.key==='manutencoes'){
      const tipoEl=document.getElementById('f_tipo');
      const origemEl=document.getElementById('f_origem');
      const descEl=document.getElementById('f_descricao');
      if(descEl){
        descEl.value=montarDescricaoCompleta(tipoEl&&tipoEl.value, origemEl&&origemEl.value, descEl.value);
      }
    }
    return oldSaveModal ? oldSaveModal.apply(this,arguments) : undefined;
  };
  try{ saveModal=window.saveModal; }catch(e){}
})();
</script>



<!-- CORREÇÃO LIMPA MANUTENÇÕES - baseada no index original enviado pelo Luiz -->
<script id="fix-limpo-manutencoes-descricao-supabase-vencimento">
(function(){
  'use strict';

  const previousSaveModalForOtherTabs = window.saveModal;
  function T(v){ return String(v ?? '').trim(); }
  function U(v){ return T(v).toUpperCase(); }
  function N(v){ const n=Number(String(v ?? '').replace(',','.')); return Number.isFinite(n)?n:0; }
  function D(v){ v=T(v); return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : ''; }
  function YM(v){ try{ return typeof ym==='function'?ym(v):(D(v)?v.slice(0,7):''); }catch(e){ return D(v)?v.slice(0,7):''; } }
  function MN(m){ try{ return typeof monthName==='function'?monthName(m):m; }catch(e){ return m||'Todos os meses'; } }
  function E(v){ try{ return typeof esc==='function'?esc(v):T(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }catch(e){ return T(v); } }
  function F(v){ try{ return typeof fmtDate==='function'?fmtDate(v):(D(v)?v.split('-').reverse().join('/'):'-'); }catch(e){ return D(v)?v.split('-').reverse().join('/'):'-'; } }
  function MNY(v){ try{ return typeof BRL==='function'?BRL(v):('R$ '+N(v).toFixed(2)); }catch(e){ return 'R$ '+N(v).toFixed(2); } }
  function TAG(s){
    const raw=T(s).toLowerCase();
    const st=(['aguardando_aceite','aguardando assinatura','aguardando_assinatura','aceito','aceita','enviado_rca','enviado_para_rca'].includes(raw))?'pendente':(raw||'concluido');
    if(st==='concluido' || st==='concluida' || st==='ok') return `<span class="tag green">Concluído</span>`;
    if(st==='pendente') return `<span class="tag amber">Pendente</span>`;
    if(st==='em_andamento' || st==='andamento' || st==='manutencao') return `<span class="tag blue">Em andamento</span>`;
    return `<span class="tag gray">${E(st.replaceAll('_',' '))}</span>`;
  }
  function CLEAN(s){ try{ return typeof clean==='function'?clean(s):T(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }catch(e){ return T(s).toLowerCase(); } }
  function newId(){ try{ return typeof id==='function'?id():Date.now()+Math.floor(Math.random()*999); }catch(e){ return Date.now()+Math.floor(Math.random()*999); } }
  function db(){ try{ return typeof connectSupabase==='function'?connectSupabase():null; }catch(e){ return null; } }

  function parseDescricaoCompleta(valor){
    const s=T(valor);
    const out={tipo:'',origem:'',validadePeca:'',descricao:s};
    if(!s) return out;
    const tipo=s.match(/(?:^|\n)\s*(?:Tipo\/peça|Tipo|Serviço)\s*:\s*([^\n]+)/i);
    const origem=s.match(/(?:^|\n)\s*Origem\s*:\s*([^\n]+)/i);
    const validade=s.match(/(?:^|\n)\s*(?:Validade da peça|Vencimento da peça|Validade)\s*:\s*([^\n]+)/i);
    const desc=s.match(/(?:^|\n)\s*Descrição\s*:\s*([\s\S]*)$/i);
    if(tipo) out.tipo=T(tipo[1]);
    if(origem) out.origem=T(origem[1]);
    if(validade) out.validadePeca=D(T(validade[1]).split('/').reverse().join('-')) || D(T(validade[1]));
    if(desc) out.descricao=T(desc[1]);
    return out;
  }

  function descricaoLimpa(obj){
    const parsed=parseDescricaoCompleta(obj.descricao || obj.obs || '');
    const tipo=T(obj.tipo || obj.servico || parsed.tipo);
    const origem=T(obj.origem || parsed.origem);
    const validade=D(obj.validadePeca || obj.validade_peca || obj.validade || parsed.validadePeca);
    const descricao=T(parsed.descricao || obj.descricao || obj.obs || '');
    const linhas=[];
    if(tipo) linhas.push('Tipo/peça: '+tipo);
    if(origem) linhas.push('Origem: '+origem);
    if(validade) linhas.push('Validade da peça: '+validade);
    if(descricao) linhas.push('Descrição: '+descricao);
    return linhas.join('\n');
  }

  function diasValidade(data){
    const d=D(data); if(!d) return {tag:'gray',texto:'Sem validade'};
    const hoje=new Date(); hoje.setHours(0,0,0,0);
    const v=new Date(d+'T00:00:00');
    const diff=Math.round((v-hoje)/86400000);
    if(diff<0) return {tag:'red',texto:`Vencido há ${Math.abs(diff)} dia${Math.abs(diff)===1?'':'s'}`};
    if(diff===0) return {tag:'red',texto:'Vence hoje'};
    if(diff<=30) return {tag:'amber',texto:`Vence em ${diff} dia${diff===1?'':'s'}`};
    return {tag:'green',texto:`Vence em ${diff} dias`};
  }

  function normalizarMan(row){
    const o={...(row||{})};
    const parsed=parseDescricaoCompleta(o.descricao || o.obs || o.observacao || '');
    o.id=Number(o.id || newId());
    o.data=D(o.data);
    o.placa=U(o.placa || o.veiculo || '');
    o.tipo=T(o.tipo || o.servico || o.peca || parsed.tipo);
    o.origem=T(o.origem || parsed.origem);
    o.validadePeca=D(o.validadePeca || o.validade_peca || o.validade_peca_manutencao || o.validade || parsed.validadePeca);
    o.descricao=T(parsed.descricao || o.descricao || o.obs || o.observacao || '');
    o.valor=N(o.valor);
    {
      const st=T(o.status || 'concluido').toLowerCase();
      o.status=(['aguardando_aceite','aguardando assinatura','aguardando_assinatura','aceito','aceita','enviado_rca','enviado_para_rca'].includes(st))?'pendente':(st||'concluido');
    }
    o.anexo=T(o.anexo || '');
    o.servico=T(o.servico || o.tipo || 'Serviço de manutenção');
    return o;
  }

  function mesesMan(){
    const salvos=(window.data?.manutencoesMeses||[]).map(x=>typeof x==='string'?x:x.mes).filter(Boolean);
    const registros=(window.data?.manutencoes||[]).map(r=>YM(r.data)).filter(Boolean);
    const meses=[...new Set([...salvos,...registros])].filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
    data.manutencoesMeses=meses.map(m=>({mes:m}));
    return meses;
  }
  function garantirMes(m){ if(!/^\d{4}-\d{2}$/.test(m||'')) return; const meses=mesesMan(); if(!meses.includes(m)) data.manutencoesMeses.push({mes:m}); }
  function linhasMes(m){ return (data.manutencoes||[]).map(normalizarMan).filter(r=>!m || YM(r.data)===m); }

  async function tabelaManutencoes(){
    if(window.__manutencoesTable) return window.__manutencoesTable;
    const c=db(); if(!c) return null;
    for(const t of ['manutencoes','manutencao']){
      try{ const r=await c.from(t).select('*').limit(1); if(!r.error){ window.__manutencoesTable=t; return t; } }catch(e){}
    }
    return null;
  }
  function colunaFaltando(err){
    const s=String(err?.message||err?.details||err?.hint||err||'');
    const m=s.match(/Could not find the '([^']+)' column|column "([^"]+)" does not exist|Could not find the ([a-zA-Z0-9_]+) column/i);
    return m ? (m[1]||m[2]||m[3]||'') : '';
  }
  async function upsertManutencao(obj){
    const c=db(), t=await tabelaManutencoes();
    if(!c || !t) return false;
    const completo=descricaoLimpa(obj);
    const payload={
      id:Number(obj.id),
      data:D(obj.data)||null,
      placa:U(obj.placa),
      veiculo:U(obj.placa),
      servico:T(obj.tipo || obj.servico || 'Serviço de manutenção'),
      tipo:T(obj.tipo || obj.servico || ''),
      origem:T(obj.origem),
      validade_peca:D(obj.validadePeca)||null,
      validade_peca_manutencao:D(obj.validadePeca)||null,
      descricao:completo,
      obs:completo,
      observacao:completo,
      valor:N(obj.valor),
      status:T(obj.status || 'concluido'),
      anexo:T(obj.anexo)
    };
    let p={...payload};
    let last=null;
    for(let i=0;i<30;i++){
      Object.keys(p).forEach(k=>{ if(p[k]===undefined) delete p[k]; });
      const r=await c.from(t).upsert(p,{onConflict:'id'}).select().single();
      if(!r.error){
        const row=normalizarMan(r.data || p);
        Object.assign(obj,row);
        obj.descricao=parseDescricaoCompleta(completo).descricao;
        return true;
      }
      last=r.error;
      const col=colunaFaltando(r.error);
      if(col && Object.prototype.hasOwnProperty.call(p,col)){ delete p[col]; continue; }
      break;
    }
    throw last || new Error('Falha ao salvar manutenção no Supabase.');
  }
  async function salvarPasta(mes){
    const c=db(); if(!c || !/^\d{4}-\d{2}$/.test(mes||'')) return;
    for(const t of ['manutencoes_meses','pastas_manutencoes']){
      try{ const r=await c.from(t).upsert({mes},{onConflict:'mes'}); if(!r.error) return; }catch(e){}
    }
  }

  window.renderManList=function(){
    const busca=CLEAN(document.getElementById('manSearch')?.value||'');
    const arr=linhasMes(selectedManMonth).filter(r=>!busca || CLEAN(Object.values(r).join(' ')).includes(busca));
    const html=arr.map(r=>{
      const validade=D(r.validadePeca || r.validade_peca || r.validade);
      const st=diasValidade(validade);
      return `<tr>
        <td>${F(r.data)}</td>
        <td><span class="plate">${E(r.placa)}</span></td>
        <td>${E(r.tipo || r.servico || '-')}</td>
        <td>${E(r.origem || '-')}</td>
        <td>${validade?F(validade):'-'}<br><span class="tag ${st.tag}">${E(st.texto)}</span></td>
        <td>${E(r.descricao || '-').replace(/\n/g,'<br>')}</td>
        <td><b>${MNY(r.valor)}</b></td>
        <td>${TAG(r.status)}</td>
        <td class="row-actions"><button class="icon-btn" onclick="openForm('manutencoes',${Number(r.id)})">✎</button><button class="icon-btn" onclick="removeItem('manutencoes',${Number(r.id)})">×</button></td>
      </tr>`;
    }).join('');
    document.getElementById('manTable').innerHTML=table(selectedManMonth?`Manutenções — ${MN(selectedManMonth)}`:'Manutenções — Todos os meses',['Data','Placa','Tipo/peça','Origem','Validade da peça','Descrição','Valor','Status','Ações'],html);
  };
  try{ renderManList=window.renderManList; }catch(e){}

  window.render_manutencoes=function(){
    mesesMan();
    setActions('<button class="btn" onclick="openAddManMonth()">+ Pasta/mês</button><button class="btn primary" onclick="openForm(\'manutencoes\')">+ Nova manutenção</button>');
    const rows=linhasMes(selectedManMonth);
    const total=rows.reduce((s,r)=>s+N(r.valor),0);
    const ticket=rows.length?total/rows.length:0;
    const folders=['',...mesesMan()].map(m=>{
      const rowsM=linhasMes(m), totalM=rowsM.reduce((s,r)=>s+N(r.valor),0), unique=new Set(rowsM.map(r=>r.placa).filter(Boolean)).size;
      return `<div class="folder editable-folder ${selectedManMonth===m?'active':''}">
        <div class="folder-main" onclick="selectManMonth('${m}')"><div class="folder-icon">📁</div><strong>${m?MN(m):'Todos os meses'}<span class="folder-count">${rowsM.length}</span></strong><small>${rowsM.length} registros • ${unique} veículos</small><small class="warn">Total: ${MNY(totalM)}</small></div>
        ${m?`<div class="folder-card-actions"><button class="icon-btn" title="Editar pasta" onclick="event.stopPropagation();editManMonth('${m}')">✎</button><button class="icon-btn danger" title="Excluir pasta" onclick="event.stopPropagation();deleteManMonth('${m}')">×</button></div>`:''}
      </div>`;
    }).join('');
    document.getElementById('manutencoes').innerHTML=stats([
      ['Registros',rows.length,selectedManMonth?'no mês selecionado':'total de serviços'],
      ['Valor',MNY(total),selectedManMonth?'total do mês':'total geral'],
      ['Ticket médio',MNY(ticket),'valor médio por serviço'],
      ['Selecionado',selectedManMonth?MN(selectedManMonth):'Todos','pasta atual']
    ])+`<div class="folders">${folders}</div>`+filterHtml('manSearch','Buscar placa, tipo, origem, validade ou descrição...')+`<div id="manTable"></div>`;
    document.getElementById('manSearch').oninput=window.renderManList;
    window.renderManList();
  };
  try{ render_manutencoes=window.render_manutencoes; }catch(e){}

  const oldOpenFormFinal=window.openForm;
  window.openForm=function(key,itemId=null){
    if(key!=='manutencoes') return oldOpenFormFinal ? oldOpenFormFinal.apply(this,arguments) : undefined;
    modalCtx={key,itemId};
    const raw=itemId?(data.manutencoes.find(x=>String(x.id)===String(itemId))||{}):{};
    const item=normalizarMan(itemId?raw:{data:selectedManMonth?selectedManMonth+'-01':'',placa:'',tipo:'',origem:'',validadePeca:'',descricao:'',valor:0,status:'concluido',anexo:''});
    const itemMes=YM(item.data) || selectedManMonth || '';
    const meses=[...new Set([itemMes, selectedManMonth, ...mesesMan()].filter(Boolean))];
    document.getElementById('modalTitle').textContent=itemId?'Editar manutenção':'Adicionar manutenção';
    document.querySelector('#modalBg .modal')?.classList.add('manutencao-modal');
    document.getElementById('modalBody').innerHTML=`<div class="form-grid">
      <div class="man-help">Cadastro de manutenção<span>Este formulário salva a descrição completa no Supabase e mantém cada registro em sua pasta correta.</span></div>
      <div class="field"><label>Pasta/Mês</label><select id="f_man_mes"><option value="">Usar mês da data</option>${meses.map(m=>`<option value="${E(m)}" ${itemMes===m?'selected':''}>${MN(m)}</option>`).join('')}</select></div>
      <div class="field"><label>Data</label><input id="f_data" type="date" value="${E(item.data||'')}"></div>
      <div class="field"><label>Placa</label><input id="f_placa" type="text" value="${E(item.placa||'')}" placeholder="Ex.: ABC1D23"></div>
      <div class="field"><label>Tipo/peça</label><input id="f_tipo" type="text" value="${E(item.tipo||'')}" placeholder="Ex.: Lona de freio"></div>
      <div class="field"><label>Origem</label><input id="f_origem" type="text" value="${E(item.origem||'')}"></div>
      <div class="field"><label>Validade da peça</label><input id="f_validadePeca" type="date" value="${E(item.validadePeca||'')}"><small id="validadePecaAviso" class="desc-muted"></small></div>
      <div class="field"><label>Valor</label><input id="f_valor" type="number" step="0.01" value="${E(item.valor||0)}"></div>
      <div class="field"><label>Status</label><select id="f_status"><option value="concluido" ${T(item.status)==='concluido'?'selected':''}>Concluído</option><option value="pendente" ${T(item.status)==='pendente'?'selected':''}>Pendente</option><option value="em andamento" ${T(item.status)==='em andamento'?'selected':''}>Em andamento</option></select></div>
      <div class="field full"><label>Descrição</label><textarea id="f_descricao" placeholder="Descreva o serviço realizado">${E(item.descricao||'')}</textarea></div>
      <div class="field full"><label>Anexo/Comprovante</label><input id="f_anexo" type="text" placeholder="Cole um link ou nome do arquivo" value="${E(item.anexo||'')}"></div>
    </div>`;
    const aviso=()=>{ const el=document.getElementById('f_validadePeca'), av=document.getElementById('validadePecaAviso'); if(av) av.textContent=diasValidade(el?.value).texto; };
    document.getElementById('f_validadePeca')?.addEventListener('change',aviso); aviso();
    document.getElementById('modalBg').classList.add('open');
  };
  try{ openForm=window.openForm; }catch(e){}

  window.saveModal=async function(){
    const ctx=(typeof modalCtx!=='undefined' && modalCtx)?{...modalCtx}:null;
    if(!ctx || ctx.key!=='manutencoes'){
      // para outras abas, usa a última implementação existente antes desta correção, se existir
      if(typeof previousSaveModalForOtherTabs==='function') return previousSaveModalForOtherTabs.apply(this,arguments);
      return;
    }
    const itemId=ctx.itemId;
    const obj=itemId?(data.manutencoes.find(x=>String(x.id)===String(itemId))||{id:Number(itemId)}):{id:newId()};
    let dataServico=D(document.getElementById('f_data')?.value);
    const mesEscolhido=T(document.getElementById('f_man_mes')?.value);
    if(mesEscolhido){
      const dia=dataServico ? dataServico.slice(8,10) : '01';
      const ultimo=new Date(Number(mesEscolhido.slice(0,4)), Number(mesEscolhido.slice(5,7)), 0).getDate();
      dataServico=mesEscolhido+'-'+String(Math.min(Number(dia)||1,ultimo)).padStart(2,'0');
    }
    if(!D(dataServico)){ alert('Preencha a data ou escolha uma pasta/mês.'); return; }
    obj.data=dataServico;
    obj.placa=U(document.getElementById('f_placa')?.value);
    obj.tipo=T(document.getElementById('f_tipo')?.value);
    obj.servico=obj.tipo || 'Serviço de manutenção';
    obj.origem=T(document.getElementById('f_origem')?.value);
    obj.validadePeca=D(document.getElementById('f_validadePeca')?.value);
    obj.descricao=T(document.getElementById('f_descricao')?.value);
    obj.valor=N(document.getElementById('f_valor')?.value);
    obj.status=T(document.getElementById('f_status')?.value || 'concluido');
    obj.anexo=T(document.getElementById('f_anexo')?.value);
    if(!itemId && !(data.manutencoes||[]).some(x=>String(x.id)===String(obj.id))) data.manutencoes.push(obj);
    garantirMes(YM(obj.data));
    // Não força selectedManMonth para junho ou qualquer outro mês: mantém a pasta que o usuário está vendo.
    try{
      await upsertManutencao(obj);
      await salvarPasta(YM(obj.data));
      if(typeof toast==='function') toast('Manutenção salva no Supabase.');
    }catch(e){
      console.error(e);
      alert('Salvou na tela, mas não salvou no Supabase. Detalhe: '+(e.message||e));
    }
    if(typeof closeModal==='function') closeModal();
    if(typeof showPage==='function') showPage(currentPage||'manutencoes');
  };
  try{ saveModal=window.saveModal; }catch(e){}

  // guarda a implementação anterior só para não quebrar outras abas caso o navegador precise dela
  if(!window.__oldSaveModalBeforeManutencaoClean && typeof saveModal==='function'){
    // intencionalmente não sobrescreve: a função atual já trata manutenção; outras abas continuam pelas funções globais antigas chamadas antes desta correção.
  }

  // Normaliza dados carregados sem apagar meses antigos.
  if(Array.isArray(window.data?.manutencoes)) data.manutencoes=data.manutencoes.map(normalizarMan);
})();
</script>
